<style>
  /* 全画面の3D。UIは画面端に浮かべる。単一ルック（夕方の草原） */

  body {
    margin: 0; overflow: hidden; background: #cfd6c8; color: var(--ink);
    font-family: var(--font-ui);

  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; }
  #fps {
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px));

  #map.compass { width: 64px; height: 64px; pointer-events: none; box-shadow: none; }
  #map.big { width: min(92vw, 80vh); height: min(92vw, 80vh); border-radius: 14px; top: 50%; right: 50%; transform: translate(50%, -50%); z-index: 5; }
  #walkui { bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); pointer-events: none; min-width: 200px; left: 50%; transform: translateX(-50%); padding: 6px 14px 10px;
    border-radius: 12px; font-size: 13px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.6); --bal: 0; }
  #walkui.follow { display: none; }
  #walkui.stare { background: rgba(200,160,40,.45); }
  #walkui.lock { background: rgba(190,50,40,.55); }
  #walkui.leave { background: rgba(60,140,80,.55); }
  #walkui.sniff { background: rgba(60,60,60,.5); }
  #walkui .bars { display: none; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; margin-top: 5px; font-size: 10px; font-weight: 500; }
  #walkui.lock .bars { display: grid; }
  #walkui .bars i { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--c) calc(var(--v) * 100%), rgba(255,255,255,.25) 0); }
  #walkui.ev { background: rgba(120,20,20,.75); }
  #flash { inset: 0; background: rgba(200,0,0,.45); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 4; }
  #flash.on { opacity: 1; transition: none; }
  #hint {
    top: calc(env(safe-area-inset-top, 0px) + 44px); left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; white-space: nowrap; transition: opacity .8s;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint.off { opacity: 0; }
  #acts {
    right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #acts button {
    width: 56px; height: 56px; border-radius: 50%; padding: 0;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
    font: 700 13px var(--font-ui); letter-spacing: .02em;
  }
  #acts #jump { width: 76px; height: 76px; font-size: 15px; margin-top: 4px; }
  #acts button:active { background: rgba(240,180,106,.45); }
  #acts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #stick { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: rgba(30,28,22,.25); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,250,240,.75); }
  #err { left: 16px; right: 16px; bottom: 140px; font-size: 12px; color: #ffd0c0; text-shadow: 0 1px 2px #000; }

<script>
// モジュールが読めない・落ちた時に画面に出す（実機で原因を見るため）
addEventListener('error', e => { const el = document.getElementById('err'); el.hidden = false; el.textContent += e.message + ' '; });

<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const VERSION = 'v33';
// 空と地面の写真素材：Poly Haven（CC0）kloofendal_38d_partly_cloudy_puresky / sparse_grass / stony_dirt_path / river_small_rocks / aerial_grass_rock
const low = /[?&]q=low/.test(location.search);
// 見え方の切り分け用（実機で比べる）：?a=ダッシュで視野を広げない ?b=地面の遠近の質感切り替えなし ?c=影なし ?d=草の層を色分け
const AB = (location.search.match(/[?&]([abcd])(?=&|$)/g) || []).map(x => x.slice(1)).join('');
const BLADES = low ? 40000 : 80000;
const PATCH = 28;              // 草を生やす範囲（犬の少し前を中心に巻き戻す）
const PATCH_AHEAD = 5.5;       // 範囲の中心を視線の先へずらす量（後ろの草は見えないので前へ回す）
// 遠景の草：まばらで幅広の葉を、手前の草が尽きるあたりから先へ広く生やす（草の切れ目を遠くの霞へ追いやる）
const FAR_BLADES = low ? 0 : 30000, FAR_PATCH = 84, FAR_AHEAD = 26;
const FOG_NEAR = 16, FOG_FAR = 150;
const FOG_COLOR = new THREE.Color(0xcdd0bc);
const SUN_DIR = new THREE.Vector3(-0.55, 0.4, -0.72).normalize();   // 太陽の方向（低め＝影が長い）
const SHADOW_BOX = 9;

const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// 町（?town）：実在の住宅地の起伏・建物・道路・池。assets/town.json は中心からの距離(m)だけで、地名や緯度経度は持たない
// 元データ：国土地理院（標高タイル・ベクトルタイル）、© OpenStreetMap contributors（林）
const TOWN = /[?&](town|walk)/.test(location.search) ? await (await fetch('assets/town.json')).json() : null;
let townH = null;
if (TOWN) {
  const raw = Uint8Array.from(atob(TOWN.height), c => c.charCodeAt(0));
  townH = Float32Array.from(new Int16Array(raw.buffer), v => v * TOWN.hScale);
}
function townHeight(x, z) {   // 標高の格子を双線形で読む（範囲の外は端の値）
  const n = TOWN.n, fx = Math.min(Math.max((x + TOWN.half) / TOWN.step, 0), n - 1.001), fz = Math.min(Math.max((z + TOWN.half) / TOWN.step, 0), n - 1.001);
  const i = Math.floor(fx), j = Math.floor(fz), ax = fx - i, az = fz - j, k = j * n + i;
  return (townH[k] * (1 - ax) + townH[k + 1] * ax) * (1 - az) + (townH[k + n] * (1 - ax) + townH[k + n + 1] * ax) * az;
}

// 地形・小川・小道・ヒース畑（JS と GLSL で同じ式。どちらかを変えたら両方変える）
function Hb(x, z) {
  return Math.sin(x * 0.045) * 1.6 + Math.cos(z * 0.038) * 1.4
       + Math.sin((x + z) * 0.09) * 0.5 + Math.sin(x * 0.17 - z * 0.13) * 0.18;
}
const streamX = TOWN ? () => 1e5 : z => 32 + Math.sin(z * 0.021) * 14 + Math.sin(z * 0.057 + 1.3) * 5;   // 町には小川と小道がない
const pathX = TOWN ? () => 1e5 : z => Math.sin(z * 0.03) * 6 + Math.sin(z * 0.071 + 0.5) * 2.5;
function H(x, z) {   // 小川の近くは谷底の高さにならし、川筋を掘る
  if (TOWN) return townHeight(x, z);
  const sx = streamX(z), ds = Math.abs(x - sx);
  const w = 1 - smooth(2, 5, ds);
  return Hb(x, z) * (1 - w) + Hb(sx, z) * w - 0.75 * (1 - smooth(0.9, 2.8, ds));
}
const waterY = z => Hb(streamX(z), z) - 0.37;
const FIELD_GLSL = TOWN ? `
uniform sampler2D uTownH, uTownMask; uniform vec3 uTownXf;   // x=標高格子の半幅 y=格子の点数 z=塗り分けの半幅
float H(vec2 p){ return texture2D(uTownH, ((p + uTownXf.x) / (2.0*uTownXf.x) * (uTownXf.y - 1.0) + 0.5) / uTownXf.y).r; }
float streamX(float z){ return 1e5; }
float pathX(float z){ return 1e5; }
float heather(vec2 p){ return 0.0; }
vec4 townMask(vec2 p){ return texture2D(uTownMask, (p + uTownXf.z) / (2.0*uTownXf.z)); }   // r=道路 g=家の周り b=水
` : `
vec4 townMask(vec2 p){ return vec4(0.0); }
float Hb(vec2 p){
  return sin(p.x*0.045)*1.6 + cos(p.y*0.038)*1.4
       + sin((p.x+p.y)*0.09)*0.5 + sin(p.x*0.17-p.y*0.13)*0.18;
}
float streamX(float z){ return 32.0 + sin(z*0.021)*14.0 + sin(z*0.057+1.3)*5.0; }
float pathX(float z){ return sin(z*0.03)*6.0 + sin(z*0.071+0.5)*2.5; }
float H(vec2 p){
  float sx = streamX(p.y); float ds = abs(p.x - sx);
  float w = 1.0 - smoothstep(2.0, 5.0, ds);
  return mix(Hb(p), Hb(vec2(sx, p.y)), w) - 0.75*(1.0 - smoothstep(0.9, 2.8, ds));
}
float heather(vec2 p){
  return smoothstep(0.25, 0.6, sin(p.x*0.071 + sin(p.y*0.05)*2.0) * cos(p.y*0.063 + sin(p.x*0.043)*1.5));
}`;

// 町の標高と塗り分けをテクスチャにして GPU へ渡す。塗り分けは 0.5m 刻み：r=道路 g=家の周り b=水。
// 同じ大きさで「入れない所」（建物・水・範囲外）の表も作り、犬とカメラがめり込まないようにする
const TOWN_PX = 0.5;
const townU = { uTownH: { value: null }, uTownMask: { value: null }, uTownXf: { value: new THREE.Vector3() } };
let townOcc = null, townMaskData = null, townMaskN = 0;
const ringOf = flat => { const r = []; for (let i = 0; i < flat.length; i += 2) r.push([flat[i], flat[i + 1]]); return r; };
if (TOWN) {
  const n = TOWN.n, hh = new Uint16Array(n * n);
  for (let k = 0; k < n * n; k++) hh[k] = THREE.DataUtils.toHalfFloat(townH[k]);
  const ht = new THREE.DataTexture(hh, n, n, THREE.RedFormat, THREE.HalfFloatType);
  ht.magFilter = ht.minFilter = THREE.LinearFilter; ht.needsUpdate = true;
  townU.uTownH.value = ht;
  const MH = TOWN.half, N = townMaskN = Math.round(2 * MH / TOWN_PX);
  const toPx = ([x, z]) => [(x + MH) / TOWN_PX, (z + MH) / TOWN_PX];
  const cv = document.createElement('canvas'); cv.width = cv.height = N;
  const c = cv.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0, 0, N, N);
  c.globalCompositeOperation = 'lighter'; c.lineCap = c.lineJoin = 'round';
  const path = (pts, close) => { c.beginPath(); pts.forEach((p, i) => { const [u, v] = toPx(p); i ? c.lineTo(u, v) : c.moveTo(u, v); }); if (close) c.closePath(); };
  c.strokeStyle = c.fillStyle = '#00ff00'; c.lineWidth = 2.4 / TOWN_PX;            // 家の周り（犬走り・駐車場）
  for (const b of TOWN.bld) { path(ringOf(b.p), true); c.fill(); c.stroke(); }
  c.strokeStyle = '#ff0000';
  for (const r of TOWN.road) { c.lineWidth = r.w / TOWN_PX; path(ringOf(r.p)); c.stroke(); }
  c.fillStyle = c.strokeStyle = '#0000ff'; c.lineWidth = 2 / TOWN_PX;
  for (const w of TOWN.water) { path(ringOf(w), true); c.fill(); }
  for (const r of TOWN.river) { path(ringOf(r)); c.stroke(); }
  townMaskData = c.getImageData(0, 0, N, N).data;
  const mt = new THREE.CanvasTexture(cv);
  mt.flipY = false; mt.colorSpace = THREE.NoColorSpace; mt.generateMipmaps = false; mt.minFilter = THREE.LinearFilter;
  townU.uTownMask.value = mt;
  townU.uTownXf.value.set(TOWN.half, n, MH);
  // 入れない所
  const oc = document.createElement('canvas'); oc.width = oc.height = N;
  const o = oc.getContext('2d');
  o.fillStyle = '#fff';
  for (const b of TOWN.bld) { o.beginPath(); ringOf(b.p).forEach((p, i) => { const [u, v] = toPx(p); i ? o.lineTo(u, v) : o.moveTo(u, v); }); o.closePath(); o.fill(); }
  for (const w of TOWN.water) { o.beginPath(); ringOf(w).forEach((p, i) => { const [u, v] = toPx(p); i ? o.lineTo(u, v) : o.moveTo(u, v); }); o.closePath(); o.fill(); }
  const od = o.getImageData(0, 0, N, N).data;
  townOcc = new Uint8Array(N * N);
  for (let k = 0; k < N * N; k++) townOcc[k] = od[k * 4] > 100 ? 1 : 0;
}
const townCell = (x, z) => {
  const i = Math.floor((x + TOWN.half) / TOWN_PX), j = Math.floor((z + TOWN.half) / TOWN_PX);
  return i < 0 || j < 0 || i >= townMaskN || j >= townMaskN ? -1 : j * townMaskN + i;
};
const townBlocked = (x, z) => {
  if (Math.abs(x) > TOWN.area || Math.abs(z) > TOWN.area) return true;   // 町の範囲の外へは出ない
  const k = townCell(x, z); return k < 0 || townOcc[k] === 1;
};
const townRoad = (x, z) => { const k = townCell(x, z); return k < 0 ? 0 : townMaskData[k * 4] / 255; };

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !low, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, low ? 1 : 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = !AB.includes('c');
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR, FOG_NEAR, FOG_FAR);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 700);

const hemi = new THREE.HemisphereLight(0xc9dcff, 0x6b6a3a, 1.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd29a, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(low ? 1024 : 2048, low ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_BOX, right: SHADOW_BOX, top: SHADOW_BOX, bottom: -SHADOW_BOX, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// 空（グラデーションの球、カメラに追従）
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f86d6) }, hor: { value: FOG_COLOR },
                sunDir: { value: SUN_DIR }, sunCol: { value: new THREE.Color(0xffc27a) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
        vec3 c = mix(hor, top, pow(h, 0.5));
        float s = max(dot(d, sunDir), 0.0);
        c += sunCol * (pow(s, 10.0) * 0.45 + pow(s, 600.0) * 6.0);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

// 遠くの山並み：稜線を何層も重ね、遠い層ほど淡く、裾は霞に溶かす（カメラに追従）
const mountains = new THREE.Group();
const RIDGE_BODY = new THREE.Color(0x3f5a52);   // 霞がかかる前の山肌（暗い青緑）
[ // 半径, 霞の濃さ(1=空と同じ), 高さ, 位相
  [340, 0.78, 46, 1.0],
  [270, 0.64, 32, 2.7],
  [210, 0.5, 20, 4.1],
  [170, 0.36, 11, 5.9],
].forEach(([R, haze, amp, seed]) => {
  const N = 180, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const h = amp * (0.55 + 0.25 * Math.sin(a * 3 + seed) + 0.13 * Math.sin(a * 7 + seed * 2)
                     + 0.06 * Math.sin(a * 17 + seed * 3) + 0.03 * Math.sin(a * 41 + seed));
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    pos.push(x, h - 6, z, x, -30, z);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  m.userData.haze = haze;
  mountains.add(m);
});
scene.add(mountains);
// 稜線は霞の色と山肌の色の混ぜ具合で塗る（空の写真を読んだら霞の色が変わるので塗り直す）
function colorRidges() {
  const top = new THREE.Color(), foot = new THREE.Color();
  for (const m of mountains.children) {
    top.copy(RIDGE_BODY).multiplyScalar(FOG_COLOR.getHSL({}).l * 1.6).lerp(FOG_COLOR, m.userData.haze);
    foot.copy(FOG_COLOR).lerp(top, 0.2);
    const c = m.geometry.attributes.color.array;
    for (let i = 0; i < c.length; i += 6) {
      c[i] = top.r; c[i + 1] = top.g; c[i + 2] = top.b;
      c[i + 3] = foot.r; c[i + 4] = foot.g; c[i + 5] = foot.b;
    }
    m.geometry.attributes.color.needsUpdate = true;
  }
}
colorRidges();

// ---------- 地面（高さと塗り分けは GPU で計算。メッシュは犬に合わせて格子単位で動かすだけ） ----------
const GROUND = 300, GSEG = 300, GSNAP = 6;
const groundGeo = new THREE.PlaneGeometry(GROUND, GROUND, GSEG, GSEG);
groundGeo.rotateX(-Math.PI / 2);
const texLoader = new THREE.TextureLoader();
const groundTex = name => {
  const t = texLoader.load(`assets/${name}.jpg`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
};
const groundTexU = {
  tMeadow: { value: groundTex('meadow') }, tFar: { value: groundTex('meadow_far') },
  tPath: { value: groundTex('path') }, tBed: { value: groundTex('riverbed') },

  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const _v = new THREE.Vector3(), _u = new THREE.Vector3(), _f = new THREE.Vector3(), _q = new THREE.Quaternion();
  // 足先（世界座標）に届くよう3節の角度を決める。最後の節（中手・中足）は地面に対してほぼ立てておく

  // ----- 歩き方 -----

    trot: { off: [0.0, 0.5, 0.5, 0.0], duty: 0.4, base: 2.2, stance: 0.26, lift: 0.065 },      // 速歩：対角の2本ずつ
    gallop: { off: [0.55, 0.65, 0.0, 0.1], duty: 0.22, base: 2.8, stance: 0.36, lift: 0.1 },   // 駆け足：後ろ2本→前2本、全部浮いている時間が長い
  };
  const gaitFreq = (g, s) => Math.max(g.base, s * g.duty / g.stance);
  const gw = { walk: 1, trot: 0, gallop: 0 };
  let phase = 0;
  const feet = legs.map((L, i) => ({ plant: new THREE.Vector3(), foot: new THREE.Vector3(), lift: new THREE.Vector3(), swing: false, s: 0, init: false }));
  const neutralW = (i, px, pz, yaw, out) => {
    const [nx, nz] = NEUTRAL[i], c = Math.cos(yaw), s = Math.sin(yaw);

  const ease = s => s * s * (3 - 2 * s);

  // ----- 姿勢と仕草 -----
  // 形は「数値の束」で表し、立ち姿→姿勢→仕草の順に重みで混ぜる
  const basePose = () => ({
    y: 0, z: 0, pitch: 0, roll: 0, rearRoll: 0, flex: 0, neck: 0, headYaw: 0, headRoll: 0, headPitch: 0,

    if (w <= 0) return;

          if (!A.legs[i]) A.legs[i] = { v: B.legs[i].clone(), w };
          else { A.legs[i].v.lerp(B.legs[i], w); A.legs[i].w = Math.max(A.legs[i].w, w); }

  };

    sit: (P, t) => {

    roll: { dur: 5.0, pose: (P, u, t) => {

    refuse: { dur: 2.1, pose: (P, u, t, A) => {

    zoom: { dur: 5.5, pose: (P) => { P.earsBack = 0.9; P.tailDown = 0.2; P.jaw = 0.25; P.tongue = 0.4; } },
    // マーキングと排便は段階を踏む（終わりは think の段取り表で決める）
    mark: { dur: Infinity, pose: (P, u, t, d) => {

  };

      P.earsBack = Math.min(P.earsBack, -0.35 * k); P.tailDown = Math.min(P.tailDown, -0.35 * k); P.wag *= 1 - k; P.look = 0;
      P.headYaw += ((S.gaze ?? 0) - P.headYaw) * k;
      if (st.speed < 0.3) lerpPose(P, { legs: [V(0.09, 0, 0.27), V(-0.09, 0, 0.27), V(0.1, 0, -0.23), V(-0.1, 0, -0.23)] }, k);   // 脚を開いて踏ん張る
    }
    // まばたき
    S.blinkT -= dt;
    if (S.blinkT < 0) { S.blink = 0.13; S.blinkT = 2 + Math.random() * 4; }
    if (S.blink > 0) { S.blink -= dt; P.eyes = 0; }

    // ----- 骨組みに当てはめる -----
    const fwdX = Math.sin(st.yaw), fwdZ = Math.cos(st.yaw);
    const gRoot = H(st.x, st.z);
    const slope = Math.atan2(H(st.x + fwdX * 0.2, st.z + fwdZ * 0.2) - H(st.x - fwdX * 0.2, st.z - fwdZ * 0.2), 0.4);
    body.position.set(0, STAND_Y + P.y + P.breath * 0.006 * Math.sin(t * (P.eyes < 0.5 ? 2 : 22)), P.z);
    body.rotation.set(-(P.pitch + slope * 0.85), 0, P.roll);
    front.rotation.set(-P.flex * 0.5, clamp(S.yawRate * 0.05, -0.2, 0.2), 0);
    rear.rotation.set(P.flex * 0.5, clamp(-S.yawRate * 0.05, -0.2, 0.2), P.rearRoll);
    front.scale.y = 1 + P.breath * 0.025 * Math.sin(t * (P.eyes < 0.5 ? 2 : 22));
    // カメラの方を見る
    root.updateMatrixWorld(true);
    root.worldToLocal(camL.copy(camPos));
    const camYawL = clamp(Math.atan2(camL.x, camL.z), -1.2, 1.2);
    const hy = P.headYaw + (camYawL - P.headYaw) * P.look;
    S.headYaw += (hy - S.headYaw) * Math.min(1, dt * 6);
    neck.rotation.set(P.neck + (P.pitch + slope * 0.85) * 0.75 + P.flex * 0.3, S.headYaw * 0.55, 0);
    head.rotation.set(P.headPitch, S.headYaw * 0.45, P.headRoll);
    jaw.rotation.x = P.jaw * 0.55;
    tongue.position.set(0, 0.004 - P.tongue * 0.012, 0.07 + P.tongue * 0.03);
    tongue.scale.set(0.033, 0.01, 0.055 + P.tongue * 0.03);
    eyes.forEach(e => { e.scale.y = 0.019 * Math.max(0.08, P.eyes); });
    ears.forEach(e => { e.rotation.x = 0.12 - P.earsBack * (0.6 + 0.5 * dash) + Math.sin(t * 43 + e.userData.s) * 0.05 * dash   // 速いほど深く倒れ、風で震える
      + (S.act === 'shake' ? Math.sin(t * 50) * 0.3 * S.actW : 0); });
    tail.rotation.set(-P.tailDown * 0.7, 0, 0.45 + Math.sin(t * P.wagHz) * P.wag);
    // 濡れると毛が暗くなる
    for (const f of fur) f.m.color.copy(f.base).multiplyScalar(1 - 0.28 * S.wet);
    root.updateMatrixWorld(true);

    // ----- 足の位置 -----
    const vx = fwdX * sp, vz = fwdZ * sp;
    const anySwing = feet.some(f => f.swing);
    let worst = 0;
    feet.forEach((F, i) => {
      if (!F.init) { neutralW(i, st.x, st.z, st.yaw, F.plant); F.foot.copy(F.plant); F.init = true; }
      if (S.air > 0.5) {                                          // 跳んでいる間：前脚は前へ、後脚は後ろへたたむ
        F.swing = false;
        tmp.set(NEUTRAL[i][0], 0.1, NEUTRAL[i][1] + (i < 2 ? 0.08 : -0.1));
        F.foot.copy(root.localToWorld(tmp));
        F.plant.set(F.foot.x, H(F.foot.x, F.foot.z) + FOOT_UP, F.foot.z);   // 着地したらその真下に足を置く
        return;
      }
      if (moving) {
        const p = (phase - off[i] + 1) % 1;                       // この脚の1歩の中での位置
        const swingNow = p >= duty;
        if (swingNow) {
          if (!F.swing) { F.swing = true; F.lift.copy(F.plant); }
          F.s = (p - duty) / (1 - duty);
          const lead = (1 - F.s) * (1 - duty) / freq + 0.5 * duty / freq;   // 着地する頃に体がいる位置の、ちょうど真下＋半歩先へ
          neutralW(i, st.x + vx * lead, st.z + vz * lead, st.yaw + S.yawRate * lead, tmp);
          F.foot.lerpVectors(F.lift, tmp, ease(F.s));
          F.foot.y = H(F.foot.x, F.foot.z) + FOOT_UP + Math.sin(Math.PI * F.s) * lift * (0.5 + 0.5 * amp);
        } else {
          if (F.swing) { F.swing = false; F.plant.set(F.foot.x, H(F.foot.x, F.foot.z) + FOOT_UP, F.foot.z); }
          F.foot.copy(F.plant);
        }
      } else {
        // 止まっている時：ずれた足だけ一歩ずつ置き直す（向きを変えた時など）
        neutralW(i, st.x, st.z, st.yaw, tmp);
        if (F.swing) {
          F.s = Math.min(1, F.s + dt / 0.26);
          F.foot.lerpVectors(F.lift, tmp, ease(F.s));
          F.foot.y = H(F.foot.x, F.foot.z) + FOOT_UP + Math.sin(Math.PI * F.s) * 0.04;
          if (F.s >= 1) { F.swing = false; F.plant.copy(tmp); }
        } else {
          const err = Math.hypot(F.plant.x - tmp.x, F.plant.z - tmp.z);
          if (err > worst) worst = err;
          if (err > 0.07 && !anySwing && !feet.some(g => g.swing)) { F.swing = true; F.s = 0; F.lift.copy(F.plant); }
          F.foot.copy(F.plant);
        }
      }
    });
    // 姿勢・仕草で決まった足の位置と混ぜる
    feet.forEach((F, i) => {
      const o = P.legs[i];
      let fw = F.foot;
      if (o && o.w > 0.001) {
        tmp2.copy(o.v); tmp2.y += 0;
        const ow = root.localToWorld(tmp2.clone());
        ow.y += H(ow.x, ow.z) - gRoot - st.jumpY + FOOT_UP;
        fw = tmp.copy(F.foot).lerp(ow, o.w);
        if (o.w > 0.98) { F.plant.set(fw.x, H(fw.x, fw.z) + FOOT_UP, fw.z); F.swing = false; }
      }
      solveLeg(legs[i], fw);
    });

    // 粒
    if (S.act && S.actData.emit === 'drops' && S.wet > 0) {
      for (let k = 0; k < 4; k++) {
        const a = Math.random() * Math.PI * 2;
        tmp.set(Math.cos(a) * 0.15, 0.32 + Math.random() * 0.15, (Math.random() - 0.5) * 0.4); root.localToWorld(tmp);
        emit(tmp, { x: Math.cos(a) * 2.2 + (Math.random() - 0.5), y: 1 + Math.random() * 1.5, z: Math.sin(a) * 2.2 + (Math.random() - 0.5) }, DROP);
      }
    }
    if (S.act === 'dig' && S.actW > 0.6 && Math.random() < 0.6) {
      tmp.set((Math.random() - 0.5) * 0.1, 0.03, 0.2); root.localToWorld(tmp);
      emit(tmp, { x: -fwdX * (1.2 + Math.random()) + (Math.random() - 0.5) * 0.6, y: 1.2 + Math.random() * 1.2, z: -fwdZ * (1.2 + Math.random()) + (Math.random() - 0.5) * 0.6 }, DIRT);
    }
    if (S.act === 'mark' && S.actData.emit === 'pee') {
      // おしっこ：後脚の付け根あたりから、上げた脚の側へ弧を描いて飛ぶ
      const s = S.actData.side;
      for (let k = 0; k < 1; k++) {                          // 一筋：1フレームに1粒、ぶれなし
        tmp.set(s * 0.03, 0.15, -0.04); root.localToWorld(tmp);
        tmp2.set(s * 1.3, 0.35, 0).applyQuaternion(root.quaternion);
        emit(tmp, tmp2, PEE);
      }
      if (S.actData.spotAt) { S.actData.spotAt = false; tmp.set(s * 0.45, 0, -0.05); root.localToWorld(tmp); addSpot(tmp.x, tmp.z, 0.18); }
    }
    if (S.act === 'poop' && S.actData.drop) {
      S.actData.drop = false;
      tmp.set(0, 0, -0.27); root.localToWorld(tmp); addPoop(tmp.x, tmp.z, st.yaw);
    }
    if ((S.act === 'mark' || S.act === 'poop') && SEQ[S.act][S.actData.ph] === 'kick' && Math.random() < 0.5) {
      tmp.set((Math.random() - 0.5) * 0.15, 0.02, -0.3); root.localToWorld(tmp);
      emit(tmp, { x: -fwdX * (1 + Math.random()) + (Math.random() - 0.5) * 0.5, y: 0.8 + Math.random(), z: -fwdZ * (1 + Math.random()) + (Math.random() - 0.5) * 0.5 }, DIRT);
    }
    updateExtras(dt);
    if (S.act) S.actData.emit = null;
    if (sp > 1 && Math.abs(st.x - streamX(st.z)) < 1.6 && Math.random() < sp * 0.08) {   // 川を走ると水しぶき
      tmp.set((Math.random() - 0.5) * 0.2, 0, 0.2); root.localToWorld(tmp); tmp.y = waterY(st.z);
      emit(tmp, { x: (Math.random() - 0.5) * 1.5 + fwdX, y: 1 + Math.random() * 1.4, z: (Math.random() - 0.5) * 1.5 + fwdZ }, DROP);
    }
    updateParticles(dt);
  }

  return { object: root, points, extras, radius: 0.5, think, command, update, state: S, __start: start, __startSeq: startSeq, __feet: feet, __legs: legs };
};

// ---------- 空の写真（HDRI）：背景・空からの光・太陽の向き・霞の色をここから決める ----------
const SKY_LEVEL = 1.6;   // 空の上半分の平均の明るさをこの値にそろえる（写真ごとの明るさの違いを吸収）
const BG_LEVEL = 0.4;    // 背景として見せる空の明るさ（照明に対する割合）
const hintText = hintEl.textContent;
hintEl.textContent = '空を読み込み中…';
new RGBELoader().load('assets/sky.hdr', tex => {
  const { data, width: W, height: HH } = tex.image;      // 半精度・RGBA・1行目が真上側
  const half = THREE.DataUtils.fromHalfFloat;
  const CLAMP = 20;                                       // 太陽そのものは平均から外す
  let best = -1, bx = 0, by = 0, wSky = 0, nHor = 0;
  const sky = [0, 0, 0], hor = [0, 0, 0];
  for (let y = 0; y < HH; y += 2) {
    const el = (0.5 - (y + 0.5) / HH) * Math.PI;
    for (let x = 0; x < W; x += 2) {
      const i = (y * W + x) * 4;
      const r = half(data[i]), g = half(data[i + 1]), b = half(data[i + 2]);
      const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (L > best) { best = L; bx = x; by = y; }
      if (el > 0) {
        const w = Math.cos(el);
        sky[0] += Math.min(r, CLAMP) * w; sky[1] += Math.min(g, CLAMP) * w; sky[2] += Math.min(b, CLAMP) * w; wSky += w;
      }
      if (el > 0.005 && el < 0.06) { hor[0] += r; hor[1] += g; hor[2] += b; nHor++; }
    }
  }
  const skyC = new THREE.Color(sky[0] / wSky, sky[1] / wSky, sky[2] / wSky);
  const scale = SKY_LEVEL / (0.2126 * skyC.r + 0.7152 * skyC.g + 0.0722 * skyC.b);
  skyC.multiplyScalar(scale);

  // 太陽の向き＝写真で一番明るい点
  const th = ((bx + 0.5) / W - 0.5) * Math.PI * 2, el = (0.5 - (by + 0.5) / HH) * Math.PI;
  SUN_DIR.set(Math.cos(th) * Math.cos(el), Math.sin(el), Math.sin(th) * Math.cos(el)).normalize();

  // 背景（照らす光より暗めに映す。そのままだと露出オーバーで空が白く飛び、雲が見えない）
  const bgScale = scale * BG_LEVEL;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = tex;
  scene.backgroundIntensity = bgScale;
  sky.visible = false;

  // 空からの光：縮小・太陽を抑えた写真から作る（そのままだと太陽が二重に効く）
  const ew = 256, eh = 128, env = new Uint16Array(ew * eh * 4), sx = W / ew, sy = HH / eh;
  for (let y = 0; y < eh; y++) for (let x = 0; x < ew; x++) {
    const i = ((Math.floor(y * sy) * W) + Math.floor(x * sx)) * 4, o = (y * ew + x) * 4;
    for (let c = 0; c < 3; c++) env[o + c] = THREE.DataUtils.toHalfFloat(Math.min(half(data[i + c]), CLAMP) * scale);
    env[o + 3] = THREE.DataUtils.toHalfFloat(1);
  }
  const envTex = new THREE.DataTexture(env, ew, eh, THREE.RGBAFormat, THREE.HalfFloatType);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.flipY = tex.flipY;
  envTex.magFilter = envTex.minFilter = THREE.LinearFilter;
  envTex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose();
  hemi.intensity = 0;                                     // 半球ライトの代わりに空の写真が照らす

  grassU.uSkyCol.value.copy(skyC).multiplyScalar(0.85);
  waterU.uSkyCol.value.copy(skyC);
  FOG_COLOR.setRGB(hor[0] / nHor * bgScale, hor[1] / nHor * bgScale, hor[2] / nHor * bgScale);   // 霞＝背景に映る地平線の色
  scene.fog.color.copy(FOG_COLOR);
  colorRidges();
  hintEl.textContent = WALK ? '左側をなぞって散歩します' : hintText;
}, undefined, () => { hintEl.textContent = '空の写真を読み込めませんでした'; });

// ---------- 散歩（?walk）：飼い主を動かし、リードでつないだ柴を連れて歩く ----------
// 柴は黒柴を見つけるとロックオンする：視線が相手に固定され、足を踏ん張って吠え続け、真後ろへ引いてもテコでも動かない。
// 犬の向きに対して横から引くほど体が回って踏ん張りが崩れる。人は張ったリードの長さの円の上しか動けないので、
// 犬の周りを回って崩しやすい向きを探し、そこから歩き出すと、崩れた流れのまま犬がついてくる
const LEASH = 1.7;
const walker = { x: 0, z: 0, yaw: 0, speed: 0, jumpY: 0 };
// 人：柴と同じく図形の組み合わせ。腰→胴→胸→首→頭、肩→上腕→ひじ→前腕→手、股→太もも→ひざ→すね→足首→靴。
// 歩く・走るは脚の付け根とひざ、腕の付け根とひじの角度を1歩の周期で動かす。リードを持つ手は肩・ひじ・手の3点で犬の方へ伸ばす
function makeHuman({ shirt, pants, hair, skin = 0xe2bc98, shoes = 0x3a3a3c }) {
  const mat = (c, r = 0.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const M = { shirt: mat(shirt), pants: mat(pants), hair: mat(hair, 0.7), skin: mat(skin, 0.75), shoes: mat(shoes, 0.6), dark: mat(0x1a1410, 0.4) };
  const SPH = new THREE.SphereGeometry(1, 18, 14);
  const blob = (m, sx, sy, sz, x, y, z, parent) => { const o = new THREE.Mesh(SPH, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z); parent.add(o); return o; };
  // 付け根から下へ伸びる太さの変わる筒（関節のふくらみ付き）
  const seg = (parent, len, r0, r1, m) => {
    const g = new THREE.CylinderGeometry(r1, r0, len, 12); g.translate(0, -len / 2, 0);
    parent.add(new THREE.Mesh(g, m)); blob(m, r1, r1, r1, 0, -len, 0, parent);
  };
  const joint = (parent, x, y, z) => { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; };
  const L = { thigh: 0.44, shin: 0.43, upper: 0.29, fore: 0.26 };
  const HIP_Y = 0.07 + L.thigh + L.shin;   // 足首の高さ＋脚の長さ

  const root = new THREE.Group();
  const pelvis = joint(root, 0, HIP_Y, 0);
  blob(M.pants, 0.15, 0.11, 0.092, 0, -0.01, 0, pelvis);                       // 腰（上着の裾から出ない大きさ）
  const torso = joint(pelvis, 0, 0.08, 0);
  // 上着：裾から肩までを一続きの回転体で作り、前後に薄くつぶす（玉を積むと浮き輪のような段ができる）
  const coat = new THREE.Mesh(new THREE.LatheGeometry([[0.001, -0.15], [0.158, -0.15], [0.162, -0.08], [0.152, 0.06], [0.158, 0.2], [0.182, 0.33], [0.192, 0.41], [0.178, 0.47], [0.12, 0.51], [0.06, 0.525], [0.001, 0.53]].map(([r, y]) => new THREE.Vector2(r, y)), 28), M.shirt);
  coat.scale.z = 0.64; torso.add(coat);
  const chest = joint(torso, 0, 0.26, 0);
  const neck = joint(chest, 0, 0.24, 0);
  seg(neck, 0.08, 0.05, 0.048, M.skin); neck.rotation.x = Math.PI;             // 首（上向きに伸ばす）
  const head = joint(chest, 0, 0.36, 0.005);
  blob(M.skin, 0.085, 0.108, 0.098, 0, 0, 0, head);                            // 頭
  blob(M.skin, 0.06, 0.05, 0.05, 0, -0.06, 0.03, head);                        // あご

          W.bal = Math.min(1.2, W.bal + lat * lat * e * (frenzy ? 0.8 : 1.6));   // 突っ込んでいる時は崩しにくい
          // 力まかせに引いた時：犬の顔の側（前方）へ引かれると後ずさりして首輪が頭から抜けそうになる。
          // 後ろ側から引いても首輪は抜けないが、首が締まってストレスがたまり（真後ろほど・相手が近いほど）、限界で飼い主に咬みつく
          const front = -(Math.sin(st.yaw) * ux + Math.cos(st.yaw) * uz);   // 犬の向き・(犬→人)：正＝顔の側から引かれている
          if (front > 0.2) W.slip = Math.min(1, W.slip + e * front * 0.3);

        {

          else { sx -= ux * e; sz -= uz * e; }          // 人は引きずられない（前へ行きたい犬がリードの端で止まる）
        }
      }
      W.bal = Math.max(0, W.bal - (W.mode === 'lock' ? 0.18 : 1) * dt);   // 引くのをやめると踏ん張り直す
      W.stress = Math.max(0, W.stress - (W.mode === 'lock' ? 0.05 : 0.15) * dt);

      if (W.mode === 'lock' && (W.stress >= 0.97 || W.slip >= 0.97) && !W.ev) {   // 限界：首輪が抜ける／振り返って咬みつく

      rivalDog.state.gaze = Math.max(-1.3, Math.min(1.3, angDiff(rdst.yaw, Math.atan2(st.x - rdst.x, st.z - rdst.z))));

      uiL.textContent = W.ev === 'slip' ? '首輪が抜けた！' : W.ev === 'bite' ? '咬まれた！' : frenzy ? '突っ込む！ リードがビンビン'
        : { follow: '', stare: 'じっと見ている…（今なら離れられる）', lock: 'ロックオン！ 吠えて動かない', leave: '崩れた！ このまま立ち去る' }[W.mode];
      uiBal.style.setProperty('--v', Math.min(W.bal, 1)); uiSt.style.setProperty('--v', W.stress); uiSl.style.setProperty('--v', W.slip);
      if (W.mode === 'follow' && W.sniff) uiL.textContent = 'くんくん…（終わるまで待つ）';
      ui.className = 'ui ' + (W.ev ? 'ev' : W.mode === 'follow' && W.sniff ? 'sniff' : W.mode);
    },
  };
}

  c.fillStyle = '#f08a3c'; c.strokeStyle = '#fff'; c.lineWidth = 1.5 * u;

function step(dt, t) {
  // 入力 → 進む向き（カメラ基準）
  let ix = input.x, iy = input.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy += 1;
  if (keys.KeyS || keys.ArrowDown) iy -= 1;
  let mag = Math.min(Math.hypot(ix, iy), 1);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  let dx = fx * iy - fz * ix, dz = fz * iy + fx * ix;
  const user = mag > 0.08;
  if (user && !hinted) { hinted = true; setTimeout(() => hintEl.classList.add('off'), 2500); }

  const S = dog.state;
  if (WALK) WALK.move(dt, t, dx, dz, user ? mag : 0);
  else {
  // 犬が何をするか決める（嫌がって踏ん張る・ズーミーで勝手に走る・お手でこちらを向く）
  dog.think(user, dt, t, st, camera.position);
  let turnRate = 7;
  if (!user) mag = 0;
  if (S.block) mag = 0;
  if (S.auto) { mag = S.auto.mag; dx = Math.sin(S.auto.yaw); dz = Math.cos(S.auto.yaw); turnRate = 5; }
  if (mag > 0) st.yaw += angDiff(st.yaw, Math.atan2(dx, dz)) * Math.min(1, dt * turnRate);
  else if (S.faceYaw !== null) st.yaw += angDiff(st.yaw, S.faceYaw) * Math.min(1, dt * 2.5);
  const inWater = Math.abs(st.x - streamX(st.z)) < 1.8;
  const target = mag * (inWater ? 3.0 : 8.5);           // 川の中は水を分けて進むので遅い
  st.speed += (target - st.speed) * Math.min(1, dt * (target > st.speed ? 2.2 : 3.5));
  const nx = st.x + Math.sin(st.yaw) * st.speed * dt, nz = st.z + Math.cos(st.yaw) * st.speed * dt;
  if (!TOWN) { st.x = nx; st.z = nz; }
  else {   // 町：家と池には入らない。ぶつかったら壁に沿って滑る（鼻先0.45mも確かめる）
    const hit = (x, z) => townBlocked(x, z) || townBlocked(x + Math.sin(st.yaw) * 0.45, z + Math.cos(st.yaw) * 0.45);
    if (!hit(nx, nz)) { st.x = nx; st.z = nz; }
    else if (!hit(nx, st.z)) st.x = nx;
    else if (!hit(st.x, nz)) st.z = nz;

  // ジャンプ

  jumpReq = false;
  st.vy -= 12 * dt; st.jumpY = Math.max(0, st.jumpY + st.vy * dt);
  if (st.jumpY === 0) st.vy = 0;
  }

  dog.update(dt, t, st, camera.position);
  const fol = WALK ? walker : st;
  const gy = H(fol.x, fol.z);
  const settled = S.pw.sit + S.pw.down + S.pw.sleep;   // 座る・伏せる時はカメラを少し寄せる
  contact.position.set(st.x, H(st.x, st.z) + 0.01, st.z);
  const cs = 0.7 / (1 + st.jumpY * 2);
  contact.scale.set(cs * 0.6, cs, 1);
  contact.rotation.z = st.yaw;

  // 太陽の影は犬の周りだけ描く（影の範囲を犬に追従させる）
  sun.target.position.set(fol.x, gy, fol.z);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 35);

  // カメラ：後ろから追う（なぞって回した直後は追わない）
  const run = smooth(2.5, 4.8, st.speed);
  if (WALK && WALK.W.mode === 'lock') { if (t - camDragT > 1.5) camYaw += angDiff(camYaw, Math.atan2(WALK.rdst.x - walker.x, WALK.rdst.z - walker.z)) * Math.min(1, dt * 1.2); }
  else if (fol.speed > 0.4 && t - camDragT > 1.5) camYaw += angDiff(camYaw, fol.yaw) * Math.min(1, dt * 1.6);
  const dash = smooth(5.5, 8.5, st.speed);
  camera.fov += ((innerWidth < innerHeight ? 62 : 50) + (AB.includes('a') ? 0 : dash * 9) - camera.fov) * Math.min(1, dt * 3);   // 速いほど視野を広げる
  camera.updateProjectionMatrix();

  else camera.lookAt(st.x, gy + 0.42 + st.jumpY * 0.5, st.z);

  // 周りの物を犬に合わせて巻き戻す
  grassU.uTime.value = t;
  // 草の範囲はカメラから測る（ダッシュでカメラが遅れても視野の先に草が残るように）
  const camF = Math.sin(camYaw), camFz = Math.cos(camYaw);
  grassU.uCenter.value.set(camera.position.x + camF * (PATCH_AHEAD + 2.7), camera.position.z + camFz * (PATCH_AHEAD + 2.7));
  farU.uCenter.value.set(camera.position.x + camF * (FAR_AHEAD + 2.7), camera.position.z + camFz * (FAR_AHEAD + 2.7));
  grassU.uDog.value.set(st.x, st.jumpY, st.z);   // y は地面からの浮き(ジャンプ中は草を押さない)
  updateGround(fol.x, fol.z);
  updateWater(fol.z);
  waterU.uTime.value = t;
  treeU.uTime.value = t;
  treeU.uDog.value.set(fol.x, fol.z);
  sky.position.copy(camera.position);
  mountains.position.set(camera.position.x, TOWN ? gy * 0.8 : 0, camera.position.z);   // 町は坂で標高が変わるので山並みも上下させる
  if (!TOWN) for (const tr of trees) {
    const x = wrap(tr.userData.bx, st.x, TREE_AREA), z = wrap(tr.userData.bz, st.z, TREE_AREA);
    tr.position.set(x, H(x, z) - 0.1, z);
    tr.visible = Math.abs(x - streamX(z)) > 4 && Math.abs(x - pathX(z)) > 2.5;   // 川と小道には木を立てない
  }
}

// 最初の一枚：小道の上、犬の斜め後ろから
st.x = pathX(0); st.yaw = 0.6; camYaw = 0.6;
if (TOWN) {   // 町：中心に一番近い道路の上から
  groundTexU.uFarGrass.value.set(0x6f7c3a).convertSRGBToLinear();   // 町の庭や空き地は草原より落ち着いた緑
  water.visible = false;
  let best = 1e9;
  for (let z = -60; z <= 60; z += 1) for (let x = -60; x <= 60; x += 1) {
    const d = x * x + z * z;
    if (d < best && townRoad(x, z) > 0.9 && !townBlocked(x, z)) { best = d; st.x = x; st.z = z; }
  }

}
