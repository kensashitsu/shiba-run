<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>しば草原</title>
<style>
  /* 全画面の3D。UIは画面端に浮かべる。単一ルック（夕方の草原） */
  :root {
    --ink: #fffaf0;
    --glass: rgba(30, 28, 22, 0.42);
    --glass-edge: rgba(255, 250, 240, 0.35);
    --accent: #f0b46a;
    --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #cfd6c8; color: var(--ink);
    font-family: var(--font-ui);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; }
  #fps {
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px));
    font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.5); opacity: .85;
  }
  #hint {
    top: calc(env(safe-area-inset-top, 0px) + 44px); left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; white-space: nowrap; transition: opacity .8s;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint.off { opacity: 0; }
  #acts {
    right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #acts button {
    width: 56px; height: 56px; border-radius: 50%; padding: 0;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
    font: 700 13px var(--font-ui); letter-spacing: .02em;
  }
  #acts #jump { width: 76px; height: 76px; font-size: 15px; margin-top: 4px; }
  #acts button:active { background: rgba(240,180,106,.45); }
  #acts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #stick { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: rgba(30,28,22,.25); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,250,240,.75); }
  #err { left: 16px; right: 16px; bottom: 140px; font-size: 12px; color: #ffd0c0; text-shadow: 0 1px 2px #000; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>

<canvas id="c"></canvas>
<div id="fps" class="ui">v8 · -- fps</div>
<div id="hint" class="ui">画面の左側をなぞると走ります</div>
<div id="acts" class="ui">
  <button type="button" data-cmd="bark">ほえる</button>
  <button type="button" data-cmd="sit">おすわり</button>
  <button type="button" data-cmd="down">ふせ</button>
  <button type="button" data-cmd="paw">お手</button>
  <button type="button" data-cmd="mark">おしっこ</button>
  <button type="button" data-cmd="poop">うんち</button>
  <button id="jump" type="button">ジャンプ</button>
</div>
<div id="stick" class="ui" hidden><div id="knob"></div></div>
<div id="err" class="ui" hidden></div>

<script>
// モジュールが読めない・落ちた時に画面に出す（実機で原因を見るため）
addEventListener('error', e => { const el = document.getElementById('err'); el.hidden = false; el.textContent += e.message + ' '; });
</script>
<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const VERSION = 'v8';
// 空と地面の写真素材：Poly Haven（CC0）kloofendal_38d_partly_cloudy_puresky / sparse_grass / stony_dirt_path / river_small_rocks / aerial_grass_rock
const low = /[?&]q=low/.test(location.search);
const BLADES = low ? 40000 : 96000;
const PATCH = 28;              // 草を生やす範囲（犬の周りで巻き戻す）
const FOG_NEAR = 16, FOG_FAR = 150;
const FOG_COLOR = new THREE.Color(0xcdd0bc);
const SUN_DIR = new THREE.Vector3(-0.55, 0.4, -0.72).normalize();   // 太陽の方向（低め＝影が長い）
const SHADOW_BOX = 9;

const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// 地形・小川・小道・ヒース畑（JS と GLSL で同じ式。どちらかを変えたら両方変える）
function Hb(x, z) {
  return Math.sin(x * 0.045) * 1.6 + Math.cos(z * 0.038) * 1.4
       + Math.sin((x + z) * 0.09) * 0.5 + Math.sin(x * 0.17 - z * 0.13) * 0.18;
}
const streamX = z => 32 + Math.sin(z * 0.021) * 14 + Math.sin(z * 0.057 + 1.3) * 5;
const pathX = z => Math.sin(z * 0.03) * 6 + Math.sin(z * 0.071 + 0.5) * 2.5;
function H(x, z) {   // 小川の近くは谷底の高さにならし、川筋を掘る
  const sx = streamX(z), ds = Math.abs(x - sx);
  const w = 1 - smooth(2, 5, ds);
  return Hb(x, z) * (1 - w) + Hb(sx, z) * w - 0.75 * (1 - smooth(0.9, 2.8, ds));
}
const waterY = z => Hb(streamX(z), z) - 0.37;
const FIELD_GLSL = `
float Hb(vec2 p){
  return sin(p.x*0.045)*1.6 + cos(p.y*0.038)*1.4
       + sin((p.x+p.y)*0.09)*0.5 + sin(p.x*0.17-p.y*0.13)*0.18;
}
float streamX(float z){ return 32.0 + sin(z*0.021)*14.0 + sin(z*0.057+1.3)*5.0; }
float pathX(float z){ return sin(z*0.03)*6.0 + sin(z*0.071+0.5)*2.5; }
float H(vec2 p){
  float sx = streamX(p.y); float ds = abs(p.x - sx);
  float w = 1.0 - smoothstep(2.0, 5.0, ds);
  return mix(Hb(p), Hb(vec2(sx, p.y)), w) - 0.75*(1.0 - smoothstep(0.9, 2.8, ds));
}
float heather(vec2 p){
  return smoothstep(0.25, 0.6, sin(p.x*0.071 + sin(p.y*0.05)*2.0) * cos(p.y*0.063 + sin(p.x*0.043)*1.5));
}`;

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !low, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, low ? 1 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR, FOG_NEAR, FOG_FAR);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 700);

const hemi = new THREE.HemisphereLight(0xc9dcff, 0x6b6a3a, 1.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd29a, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(low ? 1024 : 2048, low ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_BOX, right: SHADOW_BOX, top: SHADOW_BOX, bottom: -SHADOW_BOX, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// 空（グラデーションの球、カメラに追従）
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f86d6) }, hor: { value: FOG_COLOR },
                sunDir: { value: SUN_DIR }, sunCol: { value: new THREE.Color(0xffc27a) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
        vec3 c = mix(hor, top, pow(h, 0.5));
        float s = max(dot(d, sunDir), 0.0);
        c += sunCol * (pow(s, 10.0) * 0.45 + pow(s, 600.0) * 6.0);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

// 遠くの山並み：稜線を何層も重ね、遠い層ほど淡く、裾は霞に溶かす（カメラに追従）
const mountains = new THREE.Group();
const RIDGE_BODY = new THREE.Color(0x3f5a52);   // 霞がかかる前の山肌（暗い青緑）
[ // 半径, 霞の濃さ(1=空と同じ), 高さ, 位相
  [340, 0.78, 46, 1.0],
  [270, 0.64, 32, 2.7],
  [210, 0.5, 20, 4.1],
  [170, 0.36, 11, 5.9],
].forEach(([R, haze, amp, seed]) => {
  const N = 180, pos = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const h = amp * (0.55 + 0.25 * Math.sin(a * 3 + seed) + 0.13 * Math.sin(a * 7.3 + seed * 2)
                     + 0.06 * Math.sin(a * 17.1 + seed * 3) + 0.03 * Math.sin(a * 41 + seed));
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    pos.push(x, h - 6, z, x, -30, z);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  m.userData.haze = haze;
  mountains.add(m);
});
scene.add(mountains);
// 稜線は霞の色と山肌の色の混ぜ具合で塗る（空の写真を読んだら霞の色が変わるので塗り直す）
function colorRidges() {
  const top = new THREE.Color(), foot = new THREE.Color();
  for (const m of mountains.children) {
    top.copy(RIDGE_BODY).multiplyScalar(FOG_COLOR.getHSL({}).l * 1.6).lerp(FOG_COLOR, m.userData.haze);
    foot.copy(FOG_COLOR).lerp(top, 0.2);
    const c = m.geometry.attributes.color.array;
    for (let i = 0; i < c.length; i += 6) {
      c[i] = top.r; c[i + 1] = top.g; c[i + 2] = top.b;
      c[i + 3] = foot.r; c[i + 4] = foot.g; c[i + 5] = foot.b;
    }
    m.geometry.attributes.color.needsUpdate = true;
  }
}
colorRidges();

// ---------- 地面（高さと塗り分けは GPU で計算。メッシュは犬に合わせて格子単位で動かすだけ） ----------
const GROUND = 300, GSEG = 300, GSNAP = 6;
const groundGeo = new THREE.PlaneGeometry(GROUND, GROUND, GSEG, GSEG);
groundGeo.rotateX(-Math.PI / 2);
const texLoader = new THREE.TextureLoader();
const groundTex = name => {
  const t = texLoader.load(`assets/${name}.jpg`);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
};
const groundTexU = {
  tMeadow: { value: groundTex('meadow') }, tFar: { value: groundTex('meadow_far') },
  tPath: { value: groundTex('path') }, tBed: { value: groundTex('riverbed') }
};
const groundMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0 });
groundMat.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, groundTexU);
  sh.vertexShader = 'varying vec2 vGW;\n' + FIELD_GLSL + '\n' + sh.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec2 gw = (modelMatrix * vec4(position, 1.0)).xz;
      float hC = H(gw);
      const float e = 0.5;
      vec3 objectNormal = normalize(vec3(H(gw - vec2(e, 0.0)) - H(gw + vec2(e, 0.0)), 2.0*e,
                                         H(gw - vec2(0.0, e)) - H(gw + vec2(0.0, e))));`)
    .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position.x, hC - 0.02, position.z); vGW = gw;');
  sh.fragmentShader = 'varying vec2 vGW;\nuniform sampler2D tMeadow, tFar, tPath, tBed;\n' + FIELD_GLSL + `
    // 写真の質感は線形色で返る（sRGB テクスチャ）。同じ模様の繰り返しが目立たないよう縮尺違いを重ねる
    vec3 groundCol(vec2 p){
      float dist = length(p - cameraPosition.xz);
      vec3 near = mix(texture2D(tMeadow, p*0.33).rgb, texture2D(tMeadow, p*0.083 + 0.37).rgb, 0.4);
      near = mix(near, dot(near, vec3(0.3, 0.59, 0.11)) * vec3(0.8, 1.35, 0.45), 0.6);  // 枯れ色寄りの写真を緑へ寄せる
      vec3 far = mix(texture2D(tFar, p*0.025).rgb, texture2D(tFar, p*0.0061 + 0.5).rgb, 0.5) * vec3(0.8, 0.95, 0.7);
      vec3 g = mix(near, far, smoothstep(10.0, 45.0, dist));
      g = mix(g, g*vec3(1.05, 0.72, 1.1) + vec3(0.012, 0.0, 0.016), heather(p) * 0.85); // ヒースの株元
      float dp = abs(p.x - pathX(p.y)) + sin(p.y*1.7 + p.x)*0.07;
      g = mix(g, texture2D(tPath, p*0.5).rgb * vec3(1.35, 1.25, 1.1), 1.0 - smoothstep(0.55, 1.05, dp)); // 土の小道
      float ds = abs(p.x - streamX(p.y));
      g = mix(g, texture2D(tBed, p*0.45).rgb * 0.7, 1.0 - smoothstep(1.4, 2.3, ds));   // 川床の濡れた石
      return g;
    }
    ` + sh.fragmentShader
    .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb = groundCol(vGW);');
};
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
ground.frustumCulled = false;
scene.add(ground);
function updateGround(px, pz) {
  ground.position.set(Math.round(px / GSNAP) * GSNAP, 0, Math.round(pz / GSNAP) * GSNAP);
}

// ---------- 小川の水面（川筋に沿った帯。犬の前後だけ作り直す） ----------
const W_ROWS = 600, W_STEP = 0.5, W_HALF = 2.1, W_SNAP = 10;   // 前後150m＝霞の奥まで作る（手前で切れると端が見える）
const waterGeo = new THREE.BufferGeometry();
const wPos = new Float32Array((W_ROWS + 1) * 3 * 3);
{
  const idx = [];
  for (let r = 0; r < W_ROWS; r++) for (let c = 0; c < 2; c++) {
    const k = r * 3 + c;
    idx.push(k, k + 3, k + 1, k + 1, k + 3, k + 4);
  }
  waterGeo.setIndex(idx);
  waterGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
}
const waterU = {
  uTime: { value: 0 }, uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() }, uSkyCol: { value: new THREE.Color() },
  uFogColor: { value: FOG_COLOR }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR }
};
const water = new THREE.Mesh(waterGeo, new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uFogNear, uFogFar; varying vec3 vW; varying float vFog;
    void main(){ vW = position; vec4 mv = viewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv; vFog = smoothstep(uFogNear, uFogFar, -mv.z); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir, uSunCol, uSkyCol, uFogColor;
    varying vec3 vW; varying float vFog;
    // 水底に映る光の網目（コースティクス）
    // 2組の波の打ち消し線が交わって網目になる。値は 0〜1、ほとんどの場所で 0
    float caustic(vec2 p, float t){
      vec2 q = p + vec2(sin(p.y*1.3 + t)*0.6, cos(p.x*1.1 - t*0.8)*0.6);
      float a = abs(sin(q.x*2.1 + t*0.7) + sin(q.y*2.3 - t*0.5));
      float b = abs(sin((q.x + q.y)*1.7 - t*0.6) + sin((q.x - q.y)*1.9 + t*0.4));
      return 1.0 - smoothstep(0.0, 0.07, min(a, b));
    }
    void main(){
      vec2 p = vW.xz * 2.2 + vec2(0.0, uTime * 0.6);
      vec3 V = normalize(vW - cameraPosition);
      float cs = caustic(p, uTime * 0.5) * (1.0 - smoothstep(4.0, 14.0, length(vW - cameraPosition)));
      vec3 N = normalize(vec3(sin(p.x*2.3 + uTime*1.7)*0.05 + sin(p.y*3.1 - uTime)*0.03, 1.0, cos(p.y*2.7 + uTime*1.3)*0.05));
      float fres = pow(1.0 - max(dot(-V, N), 0.0), 3.0);
      vec3 tint = pow(vec3(0.16, 0.25, 0.24), vec3(2.2)) * (uSkyCol * 0.6 + uSunCol * 0.25);
      vec3 col = tint + uSunCol * vec3(1.0, 0.9, 0.65) * cs * 0.13;
      col = mix(col, uSkyCol * 0.3, fres * 0.7);
      vec3 R = reflect(V, N);
      col += uSunCol * pow(max(dot(R, uSunDir), 0.0), 90.0) * 0.9;
      float a = mix(0.6, 0.9, fres) + cs * 0.15;
      gl_FragColor = vec4(mix(col, uFogColor, vFog), clamp(a, 0.0, 1.0));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
water.frustumCulled = false;
scene.add(water);
let wZ = NaN;
function updateWater(pz) {
  const z0 = Math.round(pz / W_SNAP) * W_SNAP - (W_ROWS * W_STEP) / 2;
  if (z0 === wZ) return;
  wZ = z0;
  for (let r = 0; r <= W_ROWS; r++) {
    const z = z0 + r * W_STEP, sx = streamX(z), y = waterY(z);
    for (let c = 0; c < 3; c++) {
      const k = (r * 3 + c) * 3;
      wPos[k] = sx + (c - 1) * W_HALF; wPos[k + 1] = y; wPos[k + 2] = z;
    }
  }
  waterGeo.attributes.position.needsUpdate = true;
}

// ---------- 草（インスタンス描画。揺れ・押しのけ・影・逆光をシェーダで） ----------
const blade = new THREE.InstancedBufferGeometry();
blade.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.5, 0, 0,  0.5, 0, 0,
  -0.42, 0.4, 0,  0.42, 0.4, 0,
  -0.28, 0.75, 0,  0.28, 0.75, 0,
  0, 1, 0
], 3));
blade.setIndex([0,1,2, 1,3,2, 2,3,4, 3,5,4, 4,5,6]);
const offs = new Float32Array(BLADES * 3);
// 草は株ごとに生える：株の中心を散らし、その周りに数本〜十数本をまとめる（一様にばらまくと苗床に見える）
for (let i = 0, cx = 0, cz = 0, left = 0; i < BLADES; i++) {
  if (left-- <= 0) { cx = Math.random() * PATCH; cz = Math.random() * PATCH; left = 4 + Math.floor(Math.random() * 12); }
  const a = Math.random() * Math.PI * 2, d = Math.pow(Math.random(), 0.7) * 0.24;
  offs[i * 3] = (cx + Math.cos(a) * d + PATCH) % PATCH;
  offs[i * 3 + 1] = (cz + Math.sin(a) * d + PATCH) % PATCH;
  offs[i * 3 + 2] = Math.random();
}
blade.setAttribute('aOff', new THREE.InstancedBufferAttribute(offs, 3));
blade.instanceCount = BLADES;
const grassU = {
  uTime: { value: 0 }, uSize: { value: PATCH }, uCenter: { value: new THREE.Vector2() },
  uDog: { value: new THREE.Vector3() }, uDogR: { value: 0.5 }, uFogColor: { value: FOG_COLOR },
  uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR },
  uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() }, uSkyCol: { value: new THREE.Color() },
  uShadowMap: { value: null }, uShadowMatrix: { value: sun.shadow.matrix },
  uShadowTexel: { value: new THREE.Vector2(1 / sun.shadow.mapSize.x, 1 / sun.shadow.mapSize.y) }
};
const grass = new THREE.Mesh(blade, new THREE.ShaderMaterial({
  uniforms: grassU, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime, uSize, uFogNear, uFogFar, uDogR; uniform vec2 uCenter; uniform vec3 uDog;
    uniform mat4 uShadowMatrix;
    attribute vec3 aOff;
    varying float vT, vR, vFog, vWind, vHe;
    varying vec3 vWorld; varying vec4 vShadow;
    ${FIELD_GLSL}
    void main(){
      vec2 base = mod(aOff.xy - uCenter + uSize*0.5, uSize) + uCenter - uSize*0.5;
      float r = aOff.z;
      float t = position.y;

  const S = {
    posture: 'stand', pw: { sit: 0, down: 0, sleep: 0 }, postureT: 0,
    act: null, actT: 0, actW: 0, actData: {}, lastAct: null, fadeAct: null,
    bark: -1, blinkT: 2, blink: 0, idleT: 0, nextIdle: 2.5, stillT: 0,
    wet: 0, fatigue: 0, outOfWaterT: 0, faceYaw: null, auto: null, block: false,
    prevYaw: 0, yawRate: 0, prevSpeed: 0, accel: 0, air: 0,
    headYaw: 0, look: 0, clock: 0, lastMark: -99, lastPoop: -99,
  };
  const start = (name, data = {}) => {
    S.act = name; S.actT = 0; S.actData = data; S.lastAct = name; S.fadeAct = name;
    const pst = ACTIONS[name].posture;
    if (pst) S.posture = pst;
    else if (!ACTIONS[name].head) S.posture = 'stand';
  };
  // マーキング・排便を始める（段取りの最初から）
  const startSeq = (name, st) => {
    const tree = name === 'mark' ? nearestTree(st.x, st.z, 7) : null;
    start(name, { ph: 0, pt: 0, tree, side: Math.random() < 0.5 ? 1 : -1, lookYaw: 0,
      heading: st.yaw, turn: Math.random() < 0.5 ? 1 : -1, kick: Math.random() < (name === 'poop' ? 0.75 : 0.4) });
    if (name === 'mark') S.lastMark = S.clock; else S.lastPoop = S.clock;
  };
  // 段取りを1段ずつ進める
  function runSeq(dt, st) {
    const d = S.actData, seq = SEQ[S.act];
    let ph = seq[d.ph];
    const next = () => { d.ph++; d.pt = 0; ph = seq[d.ph]; };
    d.pt += dt;
    const tr = d.tree;
    const toTree = tr ? Math.atan2(tr.position.x - st.x, tr.position.z - st.z) : 0;
    d.lookYaw = tr ? clamp(Math.atan2(Math.sin(toTree - st.yaw), Math.cos(toTree - st.yaw)), -1, 1) : 0;
    if (ph === 'approach') {
      if (!tr) next();
      else {
        // 幹の手前（犬のいる側）0.45m まで歩く
        const ax = st.x - tr.position.x, az = st.z - tr.position.z, al = Math.hypot(ax, az) || 1;
        const gx = tr.position.x + ax / al * 0.36, gz = tr.position.z + az / al * 0.36;
        const gd = Math.hypot(gx - st.x, gz - st.z);
        if (gd < 0.06 + st.speed * 0.3 || d.pt > PH_DUR.approach) next();          // 止まるまでの惰性を見込んで手前で止める
        else S.auto = { mag: clamp(gd * 0.25, 0.06, 0.2), yaw: Math.atan2(gx - st.x, gz - st.z) };
      }
    } else if (ph === 'circle') {
      d.heading += d.turn * 2.6 * dt;                         // 小さく回りながら場所を探す
      S.auto = { mag: 0.2, yaw: d.heading };
    } else if (ph === 'turn') {
      if (tr) {
        // 木が真横に来るように向き直る。上げる脚は木の側
        if (d.pt <= dt) d.side = d.lookYaw >= 0 ? 1 : -1;
        S.faceYaw = toTree - d.side * Math.PI / 2;
      } else d.pt = PH_DUR.turn;
    } else if (ph === 'pee') {
      d.emit = 'pee';
      if (!d.spot) {
        d.spot = true;
        if (tr) addSpot(tr.position.x - Math.sin(toTree) * 0.15, tr.position.z - Math.cos(toTree) * 0.15, 0.35);
        else d.spotAt = true;                                 // 木がない時は足元の横（位置は形を作る側で決める）
      }
    } else if (ph === 'push' && !d.dropped && d.pt > PH_DUR.push * 0.6) { d.dropped = true; d.drop = true; }
    else if (ph === 'kick' && !d.kick) d.pt = PH_DUR.kick;
    if (ph && d.pt >= PH_DUR[ph]) next();
    if (!ph || d.ph >= seq.length) { S.act = null; S.idleT = 0; S.nextIdle = 2 + Math.random() * 3; }
  }
  const pick = list => {
    let sum = 0; for (const [, w] of list) sum += w;
    let r = Math.random() * sum;
    for (const [n, w] of list) { if ((r -= w) <= 0) return n; }
    return list[0][0];
  };

  // 何をするかを決める（毎フレーム）。user＝プレイヤーが動かしているか
  function think(user, dt, t, st, camPos) {
    const inWater = Math.abs(st.x - streamX(st.z)) < 1.8;
    if (inWater) { S.wet = 1; S.outOfWaterT = 0; if (S.posture !== 'stand') { S.posture = 'stand'; S.postureT = 0; } }   // 川の中では座らない・伏せない
    else S.outOfWaterT += dt;
    S.fatigue = clamp(S.fatigue + (st.speed > 4 ? 0.06 : -0.025) * dt, 0, 1);
    S.block = false; S.auto = null; S.faceYaw = null;

    // 長く座って・伏せていたのに急に動かされると、踏ん張って嫌がる（柴の散歩拒否）
    if (user && S.posture !== 'stand' && S.postureT > 5 && S.act !== 'refuse' && st.jumpY === 0) {
      if (Math.random() < 0.35) start('refuse', { dir: Math.random() < 0.5 ? 1 : -1 });
      else { S.posture = 'stand'; if (S.act && !ACTIONS[S.act].head) S.act = null; }
    }
    if (S.act === 'refuse') S.block = true;
    else if (user) {
      if (S.act === 'zoom' || (S.act && !ACTIONS[S.act].head)) S.act = null;
      S.posture = 'stand';
    }

    // ズーミー：プレイヤーの代わりに大きな円を描いて全力で走る
    if (S.act === 'zoom' && !user) {
      const d = S.actData;
      d.heading = (d.heading ?? st.yaw) + d.turn * (S.actT > 2.7 ? -1 : 1) * 1.7 * dt;
      S.auto = { mag: 1, yaw: d.heading };
    }

    S.clock += dt;
    if (S.act && SEQ[S.act]) runSeq(dt, st);

    const still = st.speed < 0.15 && st.jumpY === 0 && !user;
    S.stillT = still ? S.stillT + dt : 0;
    S.postureT = S.posture === 'stand' ? 0 : S.postureT + dt;

    // 濡れたら、川から上がって少しして体をブルブル振る
    if (S.wet > 0.5 && !inWater && S.outOfWaterT > 0.5 && st.jumpY === 0 && S.act !== 'shake' && S.act !== 'refuse' && !user) {
      start('shake'); S.wet = 0.99;
    }
    // お手は、まずカメラの方へ向き直る
    if (S.act === 'paw') S.faceYaw = Math.atan2(camPos.x - st.x, camPos.z - st.z);

    if (S.act) {
      S.actT += dt;
      if (S.actT >= ACTIONS[S.act].dur) {
        if (S.act === 'shake') S.wet = 0;
        S.act = null; S.idleT = 0; S.nextIdle = 1.5 + Math.random() * 3;
      }
    } else if (still) {
      // 何もしていない時に、自分で次の仕草を選ぶ
      S.idleT += dt;
      if (S.posture === 'sit' && S.postureT > 14) { S.posture = 'down'; S.postureT = 0.01; }
      else if (S.posture === 'down' && S.postureT > 22) { S.posture = 'sleep'; S.postureT = 0.01; }
      if (S.idleT > S.nextIdle && S.posture !== 'sleep') {
        S.idleT = 0; S.nextIdle = 2.5 + Math.random() * 4;
        const list = [['look', 3], ['yawn', 0.8]];
        if (inWater) list.push(['sniff', 1.5], ['drink', 4]);                     // 川の中で掘ったり転がったりはしない
        else if (S.posture === 'stand') {
          list.push(['sniff', 3], ['sit', 2.4], ['stretch', 1], ['dig', 0.8], ['roll', 0.5]);
          if (S.stillT > 8) list.push(['zoom', 0.5], ['down', 0.8]);
          if (S.clock - S.lastMark > 25) list.push(['mark', nearestTree(st.x, st.z, 7) ? 2 : 0.4]);   // 木が近いとマーキングしたくなる
          if (S.clock - S.lastPoop > 90) list.push(['poop', 0.5]);
        }
        if (S.posture === 'sit') list.push(['scratch', 1.2], ['down', 0.6]);
        const n = pick(list.filter(([k]) => k !== S.lastAct || k === 'look'));
        if (n === 'sit' || n === 'down') { S.posture = n; S.postureT = 0.01; S.lastAct = n; }
        else if (n === 'zoom') start('zoom', { turn: Math.random() < 0.5 ? 1 : -1 });
        else if (SEQ[n]) startSeq(n, st);
        else start(n);
      }
    } else S.idleT = 0;
  }

  // ボタンからの指示
  function command(c, st) {
    if (c === 'bark') { S.bark = 0; barkSound(); return; }
    if (S.act === 'refuse') return;
    S.act = null; S.idleT = 0; S.nextIdle = 4 + Math.random() * 3;
    if (c === 'sit' || c === 'down') { S.posture = c; S.postureT = 0.01; }
    if (c === 'paw') start('paw');
    if (SEQ[c] && Math.abs(st.x - streamX(st.z)) > 1.8) startSeq(c, st);   // 川の中ではしない
  }

  // 形と動き（毎フレーム）
  const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3(), camL = new THREE.Vector3();
  function update(dt, t, st, camPos) {
    // 速さ・曲がり方・加速
    const yawRate = dt > 0 ? Math.atan2(Math.sin(st.yaw - S.prevYaw), Math.cos(st.yaw - S.prevYaw)) / dt : 0;
    S.prevYaw = st.yaw;
    S.yawRate += (yawRate - S.yawRate) * Math.min(1, dt * 8);
    const accel = dt > 0 ? (st.speed - S.prevSpeed) / dt : 0; S.prevSpeed = st.speed;
    S.accel += (accel - S.accel) * Math.min(1, dt * 5);
    S.air += ((st.jumpY > 0.02 ? 1 : 0) - S.air) * Math.min(1, dt * 12);

    root.position.set(st.x, H(st.x, st.z) + st.jumpY, st.z);
    root.rotation.y = st.yaw;

    // 歩き方の混ぜ具合（速さで決める。境目で行ったり来たりしないよう少しずらす）
    const sp = st.speed;
    const want = sp < (gw.trot > 0.5 ? 1.2 : 1.45) ? 'walk' : sp < (gw.gallop > 0.5 ? 3.7 : 4.1) ? 'trot' : 'gallop';
    for (const k in gw) gw[k] += ((k === want ? 1 : 0) - gw[k]) * Math.min(1, dt * 5);
    let duty = 0, freq = 0, lift = 0;
    const off = [0, 0, 0, 0];
    {
      const sx = [0, 0, 0, 0], cx = [0, 0, 0, 0];
      for (const k in GAITS) {
        const g = GAITS[k], w = gw[k];
        duty += g.duty * w; freq += gaitFreq(g, sp) * w; lift += g.lift * w;
        for (let i = 0; i < 4; i++) { sx[i] += Math.sin(g.off[i] * 2 * Math.PI) * w; cx[i] += Math.cos(g.off[i] * 2 * Math.PI) * w; }
      }
      for (let i = 0; i < 4; i++) off[i] = (Math.atan2(sx[i], cx[i]) / (2 * Math.PI) + 1) % 1;
    }
    const moving = sp > 0.15 && S.air < 0.5;
    if (moving) phase = (phase + freq * dt) % 1;

    // 姿勢・仕草を数値の束にまとめる
    const P = basePose();
    const run = gw.gallop, trot = gw.trot, dash = smooth(5.5, 8.5, sp);   // dash＝全力疾走の度合い
    const amp = clamp(sp / 1.5, 0, 1);
    P.y = (-0.008 * gw.walk * Math.cos(4 * Math.PI * phase) - 0.012 * trot * Math.cos(4 * Math.PI * phase) + 0.025 * run * Math.sin(2 * Math.PI * phase)) * amp - (0.04 + 0.02 * dash) * run * amp;   // 全力で走る時は体を低くする
    P.pitch = 0.09 * run * Math.sin(2 * Math.PI * phase + 1.2) * amp - clamp(S.accel * 0.025, -0.15, 0.12);
    P.flex = (0.17 + 0.07 * dash) * run * Math.sin(2 * Math.PI * phase) * amp;                   // 全力で走ると背中が伸び縮みする
    P.roll = clamp(-S.yawRate * sp * 0.045, -0.3, 0.3);                           // 曲がる時は内側に傾く
    P.neck = -0.1 * run + 0.08 * trot;
    P.earsBack = run * (0.7 + 0.3 * dash);                                      // ダッシュでは耳を後ろへぴったり倒す
    P.wag = sp < 0.5 ? 0.14 : 0.05; P.wagHz = sp < 0.5 ? 8 : 5;
    if (S.fatigue > 0.3 && sp < 4.5) { const k = smooth(0.3, 0.6, S.fatigue); P.jaw = 0.42 * k; P.tongue = k; P.breath = k; }   // 走った後はハアハア
    for (const k in S.pw) {
      S.pw[k] += ((S.posture === k ? 1 : 0) - S.pw[k]) * Math.min(1, dt * 3);
      if (S.pw[k] > 0.001) { const Q = basePose(); Object.assign(Q, { jaw: P.jaw, tongue: P.tongue, breath: P.breath }); POSTURES[k](Q, t); lerpPose(P, Q, S.pw[k]); }
    }
    S.actW += ((S.act ? 1 : 0) - S.actW) * Math.min(1, dt * 4);
    if (S.act || S.actW > 0.01) {
      const name = S.act ?? S.fadeAct, A = ACTIONS[name];
      if (name === 'look' && S.actT < dt * 1.5) Object.assign(S.actData, { a1: (Math.random() - 0.5) * 1.6, a2: (Math.random() - 0.5) * 1.6, a3: (Math.random() - 0.5) * 0.6, cur: 0, toCam: Math.random() < 0.6 });
      const Q = JSON.parse(JSON.stringify({ ...P, legs: null })); Q.legs = P.legs.map(l => null);
      A.pose(Q, clamp(S.actT / A.dur, 0, 1), t, S.actData);
      lerpPose(P, Q, S.actW);
    }
    // ほえる（何をしていても重ねる）
    if (S.bark >= 0) {
      S.bark += dt;
      const u = S.bark / 0.75;
      if (u >= 1) S.bark = -1;
      else { const k = Math.max(0, Math.sin(Math.PI * ((u * 2) % 1))) * (u < 1 ? 1 : 0); P.jaw = Math.max(P.jaw, 0.75 * k); P.neck -= 0.12 * k; P.earsBack = Math.min(P.earsBack, -0.2); P.eyes = Math.min(P.eyes, 1 - 0.3 * k); }
    }
    // まばたき
    S.blinkT -= dt;
    if (S.blinkT < 0) { S.blink = 0.13; S.blinkT = 2 + Math.random() * 4; }
    if (S.blink > 0) { S.blink -= dt; P.eyes = 0; }

    // ----- 骨組みに当てはめる -----
    const fwdX = Math.sin(st.yaw), fwdZ = Math.cos(st.yaw);
    const gRoot = H(st.x, st.z);
    const slope = Math.atan2(H(st.x + fwdX * 0.2, st.z + fwdZ * 0.2) - H(st.x - fwdX * 0.2, st.z - fwdZ * 0.2), 0.4);
    body.position.set(0, STAND_Y + P.y + P.breath * 0.006 * Math.sin(t * (P.eyes < 0.5 ? 2 : 22)), P.z);
    body.rotation.set(-(P.pitch + slope * 0.85), 0, P.roll);
    front.rotation.set(-P.flex * 0.5, clamp(S.yawRate * 0.05, -0.2, 0.2), 0);
    rear.rotation.set(P.flex * 0.5, clamp(-S.yawRate * 0.05, -0.2, 0.2), P.rearRoll);
    front.scale.y = 1 + P.breath * 0.025 * Math.sin(t * (P.eyes < 0.5 ? 2 : 22));
    // カメラの方を見る
    root.updateMatrixWorld(true);
    root.worldToLocal(camL.copy(camPos));
    const camYawL = clamp(Math.atan2(camL.x, camL.z), -1.2, 1.2);
    const hy = P.headYaw + (camYawL - P.headYaw) * P.look;
    S.headYaw += (hy - S.headYaw) * Math.min(1, dt * 6);
    neck.rotation.set(P.neck + (P.pitch + slope * 0.85) * 0.75 + P.flex * 0.3, S.headYaw * 0.55, 0);
    head.rotation.set(P.headPitch, S.headYaw * 0.45, P.headRoll);
    jaw.rotation.x = P.jaw * 0.55;
    tongue.position.set(0, 0.004 - P.tongue * 0.012, 0.07 + P.tongue * 0.03);
    tongue.scale.set(0.033, 0.01, 0.055 + P.tongue * 0.03);
    eyes.forEach(e => { e.scale.y = 0.019 * Math.max(0.08, P.eyes); });
    ears.forEach(e => { e.rotation.x = 0.12 - P.earsBack * (0.6 + 0.5 * dash) + Math.sin(t * 43 + e.userData.s) * 0.05 * dash   // 速いほど深く倒れ、風で震える
      + (S.act === 'shake' ? Math.sin(t * 50) * 0.3 * S.actW : 0); });
    tail.rotation.set(-P.tailDown * 0.7, 0, 0.45 + Math.sin(t * P.wagHz) * P.wag);
    // 濡れると毛が暗くなる
    for (const f of fur) f.m.color.copy(f.base).multiplyScalar(1 - 0.28 * S.wet);
    root.updateMatrixWorld(true);

    // ----- 足の位置 -----
    const vx = fwdX * sp, vz = fwdZ * sp;
    const anySwing = feet.some(f => f.swing);
    let worst = 0;
    feet.forEach((F, i) => {
      if (!F.init) { neutralW(i, st.x, st.z, st.yaw, F.plant); F.foot.copy(F.plant); F.init = true; }
      if (S.air > 0.5) {                                          // 跳んでいる間：前脚は前へ、後脚は後ろへたたむ
        F.swing = false;
        tmp.set(NEUTRAL[i][0], 0.1, NEUTRAL[i][1] + (i < 2 ? 0.08 : -0.1));
        F.foot.copy(root.localToWorld(tmp));
        F.plant.set(F.foot.x, H(F.foot.x, F.foot.z) + FOOT_UP, F.foot.z);   // 着地したらその真下に足を置く
        return;
      }
      if (moving) {
        const p = (phase - off[i] + 1) % 1;                       // この脚の1歩の中での位置
        const swingNow = p >= duty;
        if (swingNow) {
          if (!F.swing) { F.swing = true; F.lift.copy(F.plant); }
          F.s = (p - duty) / (1 - duty);
          const lead = (1 - F.s) * (1 - duty) / freq + 0.5 * duty / freq;   // 着地する頃に体がいる位置の、ちょうど真下＋半歩先へ
          neutralW(i, st.x + vx * lead, st.z + vz * lead, st.yaw + S.yawRate * lead, tmp);
          F.foot.lerpVectors(F.lift, tmp, ease(F.s));
          F.foot.y = H(F.foot.x, F.foot.z) + FOOT_UP + Math.sin(Math.PI * F.s) * lift * (0.5 + 0.5 * amp);
        } else {
          if (F.swing) { F.swing = false; F.plant.set(F.foot.x, H(F.foot.x, F.foot.z) + FOOT_UP, F.foot.z); }
          F.foot.copy(F.plant);
        }
      } else {
        // 止まっている時：ずれた足だけ一歩ずつ置き直す（向きを変えた時など）
        neutralW(i, st.x, st.z, st.yaw, tmp);
        if (F.swing) {
          F.s = Math.min(1, F.s + dt / 0.26);
          F.foot.lerpVectors(F.lift, tmp, ease(F.s));
          F.foot.y = H(F.foot.x, F.foot.z) + FOOT_UP + Math.sin(Math.PI * F.s) * 0.04;
          if (F.s >= 1) { F.swing = false; F.plant.copy(tmp); }
        } else {
          const err = Math.hypot(F.plant.x - tmp.x, F.plant.z - tmp.z);
          if (err > worst) worst = err;
          if (err > 0.07 && !anySwing && !feet.some(g => g.swing)) { F.swing = true; F.s = 0; F.lift.copy(F.plant); }
          F.foot.copy(F.plant);
        }
      }
    });
    // 姿勢・仕草で決まった足の位置と混ぜる
    feet.forEach((F, i) => {
      const o = P.legs[i];
      let fw = F.foot;
      if (o && o.w > 0.001) {
        tmp2.copy(o.v); tmp2.y += 0;
        const ow = root.localToWorld(tmp2.clone());
        ow.y += H(ow.x, ow.z) - gRoot - st.jumpY + FOOT_UP;
        fw = tmp.copy(F.foot).lerp(ow, o.w);
        if (o.w > 0.98) { F.plant.set(fw.x, H(fw.x, fw.z) + FOOT_UP, fw.z); F.swing = false; }
      }
      solveLeg(legs[i], fw);
    });

    // 粒
    if (S.act && S.actData.emit === 'drops' && S.wet > 0) {
      for (let k = 0; k < 4; k++) {
        const a = Math.random() * Math.PI * 2;
        tmp.set(Math.cos(a) * 0.15, 0.32 + Math.random() * 0.15, (Math.random() - 0.5) * 0.4); root.localToWorld(tmp);
        emit(tmp, { x: Math.cos(a) * 2.2 + (Math.random() - 0.5), y: 1 + Math.random() * 1.5, z: Math.sin(a) * 2.2 + (Math.random() - 0.5) }, DROP);
      }
    }
    if (S.act === 'dig' && S.actW > 0.6 && Math.random() < 0.6) {
      tmp.set((Math.random() - 0.5) * 0.1, 0.03, 0.2); root.localToWorld(tmp);
      emit(tmp, { x: -fwdX * (1.2 + Math.random()) + (Math.random() - 0.5) * 0.6, y: 1.2 + Math.random() * 1.2, z: -fwdZ * (1.2 + Math.random()) + (Math.random() - 0.5) * 0.6 }, DIRT);
    }
    if (S.act === 'mark' && S.actData.emit === 'pee') {
      // おしっこ：後脚の付け根あたりから、上げた脚の側へ弧を描いて飛ぶ
      const s = S.actData.side;
      for (let k = 0; k < 3; k++) {
        tmp.set(s * 0.03, 0.15, -0.04); root.localToWorld(tmp);
        tmp2.set(s * (1.35 + Math.random() * 0.25), 0.3 + Math.random() * 0.2, (Math.random() - 0.5) * 0.15).applyQuaternion(root.quaternion);
        emit(tmp, tmp2, PEE);
      }
      if (S.actData.spotAt) { S.actData.spotAt = false; tmp.set(s * 0.45, 0, -0.05); root.localToWorld(tmp); addSpot(tmp.x, tmp.z, 0.3); }
    }
    if (S.act === 'poop' && S.actData.drop) {
      S.actData.drop = false;
      tmp.set(0, 0, -0.27); root.localToWorld(tmp); addPoop(tmp.x, tmp.z, st.yaw);
    }
    if ((S.act === 'mark' || S.act === 'poop') && SEQ[S.act][S.actData.ph] === 'kick' && Math.random() < 0.5) {
      tmp.set((Math.random() - 0.5) * 0.15, 0.02, -0.3); root.localToWorld(tmp);
      emit(tmp, { x: -fwdX * (1 + Math.random()) + (Math.random() - 0.5) * 0.5, y: 0.8 + Math.random(), z: -fwdZ * (1 + Math.random()) + (Math.random() - 0.5) * 0.5 }, DIRT);
    }
    updateExtras(dt);
    if (S.act) S.actData.emit = null;
    if (sp > 1 && Math.abs(st.x - streamX(st.z)) < 1.6 && Math.random() < sp * 0.08) {   // 川を走ると水しぶき
      tmp.set((Math.random() - 0.5) * 0.2, 0, 0.2); root.localToWorld(tmp); tmp.y = waterY(st.z);
      emit(tmp, { x: (Math.random() - 0.5) * 1.5 + fwdX, y: 1 + Math.random() * 1.4, z: (Math.random() - 0.5) * 1.5 + fwdZ }, DROP);
    }
    updateParticles(dt);
  }

  return { object: root, points, extras, radius: 0.5, think, command, update, state: S, __start: start, __startSeq: startSeq, __feet: feet, __legs: legs };
})();
scene.add(dog.object, dog.points, dog.extras);
grassU.uDogR.value = dog.radius;

// 足元の接地影（太陽の影とは別に、足元をうっすら暗くする）
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const contact = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
contact.rotation.x = -Math.PI / 2;
scene.add(contact);

// ---------- 入力 ----------
const input = { x: 0, y: 0 };
const keys = {};
let stickId = null, stickX = 0, stickY = 0, camId = null, camLastX = 0, camDragT = -99;
const stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
const hintEl = document.getElementById('hint');
let jumpReq = false;
const STICK_R = 50;
const clock = new THREE.Clock();

canvas.addEventListener('pointerdown', e => {
  if (e.clientX < innerWidth * 0.55 && stickId === null) {
    stickId = e.pointerId; stickX = e.clientX; stickY = e.clientY;
    stickEl.style.left = stickX + 'px'; stickEl.style.top = stickY + 'px';
    knobEl.style.transform = ''; stickEl.hidden = false;
  } else if (camId === null) {
    camId = e.pointerId; camLastX = e.clientX;
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stickId) {
    let dx = e.clientX - stickX, dy = e.clientY - stickY;
    const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / STICK_R; input.y = -dy / STICK_R;
  } else if (e.pointerId === camId) {
    camYaw -= (e.clientX - camLastX) * 0.006; camLastX = e.clientX; camDragT = clock.elapsedTime;
  }
});
const endPointer = e => {
  if (e.pointerId === stickId) { stickId = null; input.x = input.y = 0; stickEl.hidden = true; }
  if (e.pointerId === camId) camId = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
const jumpBtn = document.getElementById('jump');
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); jumpReq = true; });
jumpBtn.addEventListener('click', e => { if (e.detail === 0) jumpReq = true; });
document.querySelectorAll('#acts [data-cmd]').forEach(b => {
  const run = () => dog.command(b.dataset.cmd, st);
  b.addEventListener('pointerdown', e => { e.preventDefault(); run(); });
  b.addEventListener('click', e => { if (e.detail === 0) run(); });   // キーボード操作
});
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { jumpReq = true; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- 状態 ----------
const st = { x: 0, z: 0, yaw: 0, speed: 0, jumpY: 0, vy: 0 };
const TEST = /[?&]test/.test(location.search);
let camSnap = false, simT = 0;
let camYaw = 0;
const fpsEl = document.getElementById('fps');
let fpsN = 0, fpsT = 0, hinted = false;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const camGoal = new THREE.Vector3();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// 光の色と強さを草シェーダにも渡す（地面・犬と同じ明るさに揃える）
grassU.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity);
grassU.uSkyCol.value.copy(hemi.color).lerp(hemi.groundColor, 0.35).multiplyScalar(hemi.intensity);
waterU.uSunCol.value.copy(grassU.uSunCol.value);
waterU.uSkyCol.value.copy(hemi.color).multiplyScalar(hemi.intensity);

// ---------- 空の写真（HDRI）：背景・空からの光・太陽の向き・霞の色をここから決める ----------
const SKY_LEVEL = 1.6;   // 空の上半分の平均の明るさをこの値にそろえる（写真ごとの明るさの違いを吸収）
const BG_LEVEL = 0.4;    // 背景として見せる空の明るさ（照明に対する割合）
const hintText = hintEl.textContent;
hintEl.textContent = '空を読み込み中…';
new RGBELoader().load('assets/sky.hdr', tex => {
  const { data, width: W, height: HH } = tex.image;      // 半精度・RGBA・1行目が真上側
  const half = THREE.DataUtils.fromHalfFloat;
  const CLAMP = 20;                                       // 太陽そのものは平均から外す
  let best = -1, bx = 0, by = 0, wSky = 0, nHor = 0;
  const sky = [0, 0, 0], hor = [0, 0, 0];
  for (let y = 0; y < HH; y += 2) {
    const el = (0.5 - (y + 0.5) / HH) * Math.PI;
    for (let x = 0; x < W; x += 2) {
      const i = (y * W + x) * 4;
      const r = half(data[i]), g = half(data[i + 1]), b = half(data[i + 2]);
      const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      if (L > best) { best = L; bx = x; by = y; }
      if (el > 0) {
        const w = Math.cos(el);
        sky[0] += Math.min(r, CLAMP) * w; sky[1] += Math.min(g, CLAMP) * w; sky[2] += Math.min(b, CLAMP) * w; wSky += w;
      }
      if (el > 0.005 && el < 0.06) { hor[0] += r; hor[1] += g; hor[2] += b; nHor++; }
    }
  }
  const skyC = new THREE.Color(sky[0] / wSky, sky[1] / wSky, sky[2] / wSky);
  const scale = SKY_LEVEL / (0.2126 * skyC.r + 0.7152 * skyC.g + 0.0722 * skyC.b);
  skyC.multiplyScalar(scale);

  // 太陽の向き＝写真で一番明るい点
  const th = ((bx + 0.5) / W - 0.5) * Math.PI * 2, el = (0.5 - (by + 0.5) / HH) * Math.PI;
  SUN_DIR.set(Math.cos(th) * Math.cos(el), Math.sin(el), Math.sin(th) * Math.cos(el)).normalize();

  // 背景（照らす光より暗めに映す。そのままだと露出オーバーで空が白く飛び、雲が見えない）
  const bgScale = scale * BG_LEVEL;
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.background = tex;
  scene.backgroundIntensity = bgScale;
  sky.visible = false;

  // 空からの光：縮小・太陽を抑えた写真から作る（そのままだと太陽が二重に効く）
  const ew = 256, eh = 128, env = new Uint16Array(ew * eh * 4), sx = W / ew, sy = HH / eh;
  for (let y = 0; y < eh; y++) for (let x = 0; x < ew; x++) {
    const i = ((Math.floor(y * sy) * W) + Math.floor(x * sx)) * 4, o = (y * ew + x) * 4;
    for (let c = 0; c < 3; c++) env[o + c] = THREE.DataUtils.toHalfFloat(Math.min(half(data[i + c]), CLAMP) * scale);
    env[o + 3] = THREE.DataUtils.toHalfFloat(1);
  }
  const envTex = new THREE.DataTexture(env, ew, eh, THREE.RGBAFormat, THREE.HalfFloatType);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.flipY = tex.flipY;
  envTex.magFilter = envTex.minFilter = THREE.LinearFilter;
  envTex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(envTex).texture;
  pmrem.dispose();
  hemi.intensity = 0;                                     // 半球ライトの代わりに空の写真が照らす

  grassU.uSkyCol.value.copy(skyC).multiplyScalar(0.85);
  waterU.uSkyCol.value.copy(skyC);
  FOG_COLOR.setRGB(hor[0] / nHor * bgScale, hor[1] / nHor * bgScale, hor[2] / nHor * bgScale);   // 霞＝背景に映る地平線の色
  scene.fog.color.copy(FOG_COLOR);
  colorRidges();
  hintEl.textContent = hintText;
}, undefined, () => { hintEl.textContent = '空の写真を読み込めませんでした'; });

function step(dt, t) {
  // 入力 → 進む向き（カメラ基準）
  let ix = input.x, iy = input.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy += 1;
  if (keys.KeyS || keys.ArrowDown) iy -= 1;
  let mag = Math.min(Math.hypot(ix, iy), 1);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  let dx = fx * iy - fz * ix, dz = fz * iy + fx * ix;
  const user = mag > 0.08;
  if (user && !hinted) { hinted = true; setTimeout(() => hintEl.classList.add('off'), 2500); }

  // 犬が何をするか決める（嫌がって踏ん張る・ズーミーで勝手に走る・お手でこちらを向く）
  dog.think(user, dt, t, st, camera.position);
  const S = dog.state;
  let turnRate = 7;
  if (!user) mag = 0;
  if (S.block) mag = 0;
  if (S.auto) { mag = S.auto.mag; dx = Math.sin(S.auto.yaw); dz = Math.cos(S.auto.yaw); turnRate = 5; }
  if (mag > 0) st.yaw += angDiff(st.yaw, Math.atan2(dx, dz)) * Math.min(1, dt * turnRate);
  else if (S.faceYaw !== null) st.yaw += angDiff(st.yaw, S.faceYaw) * Math.min(1, dt * 2.5);
  const inWater = Math.abs(st.x - streamX(st.z)) < 1.8;
  const target = mag * (inWater ? 3.0 : 8.5);           // 川の中は水を分けて進むので遅い
  st.speed += (target - st.speed) * Math.min(1, dt * (target > st.speed ? 2.2 : 3.5));
  st.x += Math.sin(st.yaw) * st.speed * dt;
  st.z += Math.cos(st.yaw) * st.speed * dt;

  // ジャンプ
  if (jumpReq && st.jumpY <= 0.001 && !S.block) { st.vy = 3.6; S.posture = 'stand'; if (S.act && S.act !== 'zoom') S.act = null; }
  jumpReq = false;
  st.vy -= 12 * dt; st.jumpY = Math.max(0, st.jumpY + st.vy * dt);
  if (st.jumpY === 0) st.vy = 0;

  dog.update(dt, t, st, camera.position);
  const gy = H(st.x, st.z);
  const settled = S.pw.sit + S.pw.down + S.pw.sleep;   // 座る・伏せる時はカメラを少し寄せる
  contact.position.set(st.x, gy + 0.01, st.z);
  const cs = 0.7 / (1 + st.jumpY * 2);
  contact.scale.set(cs * 0.6, cs, 1);
  contact.rotation.z = st.yaw;

  // 太陽の影は犬の周りだけ描く（影の範囲を犬に追従させる）
  sun.target.position.set(st.x, gy, st.z);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 35);

  // カメラ：後ろから追う（なぞって回した直後は追わない）
  const run = smooth(2.5, 4.8, st.speed);
  if (st.speed > 0.4 && t - camDragT > 1.5) camYaw += angDiff(camYaw, st.yaw) * Math.min(1, dt * 1.6);
  const dash = smooth(5.5, 8.5, st.speed);
  camera.fov += ((innerWidth < innerHeight ? 62 : 50) + dash * 9 - camera.fov) * Math.min(1, dt * 3);   // 速いほど視野を広げる
  camera.updateProjectionMatrix();
  const dist = 2.7 + run * 0.5 + dash * 0.4 - Math.min(settled, 1) * 0.4, ch = 1.0 + run * 0.15;
  const cx = st.x - Math.sin(camYaw) * dist, cz = st.z - Math.cos(camYaw) * dist;
  const cy = Math.max(gy + ch, H(cx, cz) + 0.45);
  camera.position.lerp(camGoal.set(cx, cy, cz), camSnap ? 1 : Math.min(1, dt * 6));
  camSnap = false;
  camera.lookAt(st.x, gy + 0.42 + st.jumpY * 0.5, st.z);

  // 周りの物を犬に合わせて巻き戻す
  grassU.uTime.value = t;
  grassU.uCenter.value.set(st.x, st.z);
  grassU.uDog.value.set(st.x, gy + st.jumpY, st.z);
  updateGround(st.x, st.z);
  updateWater(st.z);
  waterU.uTime.value = t;
  treeU.uTime.value = t;
  treeU.uDog.value.set(st.x, st.z);
  sky.position.copy(camera.position);
  mountains.position.set(camera.position.x, 0, camera.position.z);
  for (const tr of trees) {
    const x = wrap(tr.userData.bx, st.x, TREE_AREA), z = wrap(tr.userData.bz, st.z, TREE_AREA);
    tr.position.set(x, H(x, z) - 0.1, z);
    tr.visible = Math.abs(x - streamX(z)) > 4 && Math.abs(x - pathX(z)) > 2.5;   // 川と小道には木を立てない
  }
}

// 最初の一枚：小道の上、犬の斜め後ろから
st.x = pathX(0); st.yaw = 0.6; camYaw = 0.6;
step(0, 0);
camera.position.set(st.x - Math.sin(camYaw) * 2.7, H(st.x, st.z) + 1.0, st.z - Math.cos(camYaw) * 2.7);
camera.lookAt(st.x, H(st.x, st.z) + 0.42, st.z);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (!TEST) step(dt, t);   // 確認用（?test）は時間を手で進める
  renderer.render(scene, camera);
  if (sun.shadow.map) grassU.uShadowMap.value = sun.shadow.map.texture;
  fpsN++;
  const now = performance.now();
  if (now - fpsT >= 500) { fpsEl.textContent = VERSION + ' · ' + Math.round(fpsN * 1000 / (now - fpsT)) + ' fps'; fpsN = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__step = d => { simT += d; step(d, simT); };
window.__shiba = { trees, snapCam: () => { camSnap = true; step(1e-4, simT); }, st, input, keys, dog, streamX, pathX, SUN_DIR, setCamYaw: v => { camYaw = v; } };
</script>
</body>
</html>
