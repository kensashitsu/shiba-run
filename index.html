<style>
  /* 全画面の3D。UIは画面端に浮かべる。単一ルック（夕方の草原） */
  :root {
    --ink: #fffaf0;
    --glass: rgba(30, 28, 22, 0.42);
    --glass-edge: rgba(255, 250, 240, 0.35);
    --accent: #f0b46a;
    --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #cfd6c8; color: var(--ink);
    font-family: var(--font-ui);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; }
  #fps {
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px));
    font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.5); opacity: .85;
  }
  #homeBtn { top: calc(env(safe-area-inset-top, 0px) + 54px); left: max(12px, env(safe-area-inset-left, 0px)); padding: 3px 9px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 600 11px var(--font-ui); opacity: .75; }
  #title { inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 12px;
    padding: 0 24px calc(env(safe-area-inset-bottom, 0px) + 9vh); background: linear-gradient(to bottom, rgba(20,18,14,.35), rgba(20,18,14,0) 30%, rgba(20,18,14,0) 55%, rgba(20,18,14,.55)); }
  #title[hidden] { display: none; }
  body.early #title { z-index: 60; }   /* 読み込み中：読み込み画面の上にタイトルを出す */
  body.early #boot > * { visibility: hidden; }
  #title button.wait { opacity: .7; }
  #title h1 { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 11vh); left: 0; right: 0; margin: 0; text-align: center; color: #fffaf0;
    font: 700 clamp(44px, 13vw, 76px) var(--font-ui); letter-spacing: .08em; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
  #title h1 small { display: block; margin-top: 6px; font-size: clamp(13px, 3.6vw, 17px); font-weight: 500; letter-spacing: .12em; opacity: .9; }
  #title button { width: min(280px, 80vw); height: 54px; border-radius: 27px; border: 1px solid var(--glass-edge); background: var(--glass); color: var(--ink);
    font: 700 17px var(--font-ui); letter-spacing: .06em; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #title button.main { background: rgba(240,180,106,.85); color: #2b2118; border-color: rgba(255,240,210,.7); }
  #title button[hidden] { display: none; }
  #tTown { display: flex; flex-wrap: wrap; justify-content: center; max-width: min(340px, 92vw); align-items: center; gap: 6px; color: #fffaf0; font: 600 13px var(--font-ui); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #tTown span { margin-right: 4px; opacity: .85; }
  #title #tTown button { width: auto; height: 34px; padding: 0 16px; border-radius: 17px; font-size: 14px; }
  #title #tTown button.on { background: rgba(255,250,240,.9); color: #2b2118; }
  #tVer { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); right: max(14px, env(safe-area-inset-right, 0px)); color: #fffaf0; font: 500 12px var(--font-ui); letter-spacing: .04em; opacity: .7; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  @media (orientation: landscape) and (max-height: 520px) {   /* 横持ち：ボタンは下に横並び */
    #title { flex-direction: row; align-items: flex-end; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 5vh); }
    #title h1 { top: calc(env(safe-area-inset-top, 0px) + 5vh); font-size: clamp(36px, 9vh, 56px); }
    #title button { width: min(190px, 28vw); height: 46px; font-size: 15px; }
  }
  body.titling .ui:not(#title) { visibility: hidden; }
  #fpvBtn { top: calc(env(safe-area-inset-top, 0px) + 54px); left: calc(max(12px, env(safe-area-inset-left, 0px)) + 74px); padding: 3px 9px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 600 11px var(--font-ui); opacity: .75; }
  #fpvBtn.on, #gyroBtn.on { background: rgba(240,180,106,.6); opacity: .95; }
  #gyroBtn { top: calc(env(safe-area-inset-top, 0px) + 84px); left: max(12px, env(safe-area-inset-left, 0px)); padding: 3px 9px; border-radius: 12px;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 600 11px var(--font-ui); opacity: .75; }
  #gyroBtn[hidden] { display: none; }
  #dogArrow { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(240,180,106,.75); color: #2b2118;
    font: 700 12px var(--font-ui); display: grid; place-items: center; pointer-events: none; }
  #dogArrow::after { content: ''; position: absolute; left: 50%; top: 50%; border: 7px solid transparent; border-left: 10px solid rgba(240,180,106,.9); transform: translate(13px, -7px); transform-origin: -13px 7px; rotate: var(--a, 0rad); }
  #dogArrow[hidden] { display: none; }
  #credit { position: fixed; right: 8px; bottom: 4px; font-size: 9px; color: rgba(255,255,255,.75); text-shadow: 0 0 3px rgba(0,0,0,.6); }
  #map { top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(10px, env(safe-area-inset-right, 0px));
    width: 104px; height: 104px; border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #map.compass { width: 64px; height: 64px; pointer-events: none; box-shadow: none; }
  #map.big { width: min(92vw, 80vh); height: min(92vw, 80vh); border-radius: 14px; top: 50%; right: 50%; transform: translate(50%, -50%); z-index: 5; touch-action: none; cursor: grab; }
  #walkui { bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); pointer-events: none; min-width: 200px; left: 50%; transform: translateX(-50%); padding: 6px 14px 10px;
    border-radius: 12px; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); --bal: 0;
    width: max-content; max-width: calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); white-space: normal; text-align: center; line-height: 1.45; box-sizing: border-box; }   /* 長い文は画面の幅で折り返す（はみ出して先頭が切れないように） */
  #walkui.follow { display: none; }
  #stam { left: max(12px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 32px); display: flex; align-items: center; gap: 6px;
    font-size: 11px; text-shadow: 0 1px 2px rgba(0,0,0,.6); transition: opacity .6s; --v: 1; }
  #stam i { width: 90px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c, #9be07a) calc(var(--v) * 100%), rgba(255,255,255,.25) 0); }
  #stam.full { opacity: 0; }
  #walkui.stare { background: rgba(200,160,40,.45); }
  #walkui.lock { background: rgba(190,50,40,.55); }
  #walkui.leave { background: rgba(60,140,80,.55); }
  #walkui.sniff { background: rgba(60,60,60,.5); }
  #walkui.harm { background: rgba(40,40,40,.32); font-weight: 500; letter-spacing: .08em; }
  #walkui.harm.full { background: rgba(70,150,110,.6); font-weight: 700; }
  #walkui .bars { display: none; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; margin-top: 5px; font-size: 10px; font-weight: 500; }
  #walkui.lock .bars { display: grid; }
  #walkui .bars i { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--c) calc(var(--v) * 100%), rgba(255,255,255,.25) 0); }
  #walkui.ev { background: rgba(120,20,20,.75); }
  #flash { inset: 0; background: rgba(200,0,0,.45); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 4; }
  #flash.on { opacity: 1; transition: none; }
  #hint {
    top: calc(env(safe-area-inset-top, 0px) + 44px); left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; white-space: nowrap; transition: opacity .8s;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint.off { opacity: 0; }
  #acts {
    right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #acts button {
    width: 56px; height: 56px; border-radius: 50%; padding: 0;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
    font: 700 13px var(--font-ui); letter-spacing: .02em;
  }
  #pickBtn { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 244px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: rgba(250,248,240,.85); border: 2px solid #8a6a3a; color: #4a3520;
    font: 700 15px var(--font-ui); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #pickBtn:active { background: rgba(240,180,106,.8); }
  #crouchBtn { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 700 13px var(--font-ui); }
  #crouchBtn.on { background: rgba(240,180,106,.6); }
  #tugBtn { right: max(88px, calc(env(safe-area-inset-right, 0px) + 88px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: rgba(250,248,240,.85); border: 2px solid #8a6a3a; color: #4a3520; font: 700 14px var(--font-ui); box-shadow: 0 2px 8px rgba(0,0,0,.3); touch-action: none; }
  #tugBtn.on { background: rgba(240,180,106,.9); }
  #tugBtn[hidden] { display: none; }
  body.pad #tugBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); }
  #pickBtn.off, #crouchBtn.off, #treatBtn.off, #catchBtn.off { opacity: .32; pointer-events: none; box-shadow: none; }
  .key { display: none; font: 600 10px var(--font-ui); opacity: .75; margin-top: 2px; }
  @media (hover: hover) and (pointer: fine) { .key { display: block; } }
  #treatBtn { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 170px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 700 13px var(--font-ui); }
  #treatBtn:active, #treatBtn.on { background: rgba(240,180,106,.8); }
  #treatTray { right: max(88px, calc(env(safe-area-inset-right, 0px) + 88px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 180px); display: flex; gap: 6px; }
  #treatTray[hidden] { display: none; }
  #treatTray button { min-width: 58px; height: 44px; padding: 0 9px; border-radius: 22px; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 700 13px var(--font-ui); }
  #treatTray button:active { background: rgba(240,180,106,.8); }
  #shortBtn { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 318px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink); font: 700 13px var(--font-ui); }
  #shortBtn.on { background: rgba(240,180,106,.6); }
  #shortBtn.off { opacity: .32; pointer-events: none; }
  #catchBtn { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 244px);
    width: 64px; height: 64px; border-radius: 50%; padding: 0; background: rgba(250,248,240,.9); border: 2px solid #b0452a; color: #7a2a14;
    font: 700 14px var(--font-ui); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #acts #jump { width: 76px; height: 76px; font-size: 15px; margin-top: 4px; }
  #acts button:active { background: rgba(240,180,106,.45); }
  #acts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #stick { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: rgba(30,28,22,.25); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,250,240,.75); }
  #lookPad { right: max(14px, calc(env(safe-area-inset-right, 0px) + 14px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); width: 124px; height: 124px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: rgba(30,28,22,.28); touch-action: none; }
  #lookPad[hidden] { display: none; }
  #lookPad span { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.5; color: var(--ink); font: 600 11px var(--font-ui); opacity: .55; pointer-events: none; }
  #lookKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,250,240,.7); pointer-events: none; }
  body.pad #crouchBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 160px); }   /* 操作盤を出している時：右の列のボタンを操作盤の上へ */
  body.pad #treatBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 232px); }
  body.pad #treatTray { bottom: calc(env(safe-area-inset-bottom, 0px) + 242px); }
  body.pad #pickBtn, body.pad #catchBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 304px); }
  body.pad #shortBtn { bottom: calc(env(safe-area-inset-bottom, 0px) + 376px); }
  /* 読み込み画面：ボタン類や描きかけの画面を隠す。絵も動きも無い（読み込みの邪魔をしない） */
  #boot { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: calc(env(safe-area-inset-top, 0px) + 11vh);   /* 題字はタイトル画面と同じ位置 */
    background: linear-gradient(to bottom, #6d8a5c, #3f5236); color: #fffaf0; text-align: center; }
  #boot b { font: 700 clamp(40px, 12vw, 68px) var(--font-ui); letter-spacing: .08em; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
  #boot i { font: normal 500 clamp(13px, 3.6vw, 17px) var(--font-ui); letter-spacing: .12em; opacity: .9; }
  #boot span { margin-top: 30vh; font: 500 14px var(--font-ui); letter-spacing: .12em; opacity: .85; }
  #boot small { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); right: max(14px, env(safe-area-inset-right, 0px)); font: 500 12px var(--font-ui); opacity: .6; }
  #err { z-index: 60; left: 16px; right: 16px; bottom: 140px; font-size: 12px; color: #ffd0c0; text-shadow: 0 1px 2px #000; }
</style>

<body>
<div id="boot"><b>しば草原</b><i>言うことをきかない柴と、町を散歩する</i><span>読み込み中…</span><small>v147</small></div>

<canvas id="c"></canvas>
<div id="fps" class="ui">v147 · -- fps</div>
<button type="button" id="homeBtn" class="ui">タイトル</button>
<div id="title" class="ui" hidden><h1>しば草原<small>言うことをきかない柴と、町を散歩する</small></h1>
<div id="tTown"><span>町</span><button type="button" data-town="home">いつもの町</button><button type="button" data-town="seto">瀬戸</button></div>
<button type="button" id="tContinue" hidden>つづける</button><button type="button" id="tWalk" class="main">散歩にでかける</button><button type="button" id="tTownRun">町を走る</button><button type="button" id="tMeadow">草原を走る</button><div id="tVer"></div></div>
<button type="button" id="fpvBtn" class="ui" hidden>一人称<span class="key">V</span></button>
<button type="button" id="gyroBtn" class="ui" hidden>ジャイロ 切</button>
<div id="dogArrow" class="ui" hidden>柴</div>
<canvas id="map" class="ui"></canvas>
<div id="stam" class="ui" hidden><span>体力</span><i></i></div>
<button type="button" id="pickBtn" class="ui" hidden>拾う<span class="key">E</span></button>
<button type="button" id="crouchBtn" class="ui" hidden>しゃがむ</button>
<button type="button" id="tugBtn" class="ui" hidden>たぐる<span class="key">F</span></button>
<button type="button" id="treatBtn" class="ui" hidden>おやつ<span class="key">T</span></button>
<div id="treatTray" class="ui" hidden><button type="button" id="treat0">砂肝<span class="key">1</span></button><button type="button" id="treat1">カワハギ<span class="key">2</span></button><button type="button" id="treat2">煮干し<span class="key">3</span></button><button type="button" id="treat3">水<span class="key">4</span></button></div>
<button type="button" id="shortBtn" class="ui" hidden>短く<span class="key">R</span></button>
<button type="button" id="catchBtn" class="ui" hidden>捕まえる<span class="key">E</span></button>
<div id="walkui" class="ui" hidden><div id="wl"></div><div class="bars"><span>崩し</span><i id="wbal" style="--c:#ffe08a;--v:0"></i><span>首輪</span><i id="wsl" style="--c:#8ad0ff;--v:0"></i><span>ストレス</span><i id="wst" style="--c:#ff7a5c;--v:0"></i></div></div>
<div id="flash" class="ui"></div>
<div id="credit" class="ui" hidden>地図：国土地理院・© OpenStreetMap</div>
<div id="hint" class="ui">画面の左側をなぞると走ります</div>
<div id="acts" class="ui">
  <button type="button" data-cmd="bark">ほえる</button>
  <button type="button" data-cmd="sit">おすわり</button>
  <button type="button" data-cmd="down">ふせ</button>
  <button type="button" data-cmd="paw">お手</button>
  <button type="button" data-cmd="mark">おしっこ</button>
  <button type="button" data-cmd="poop">うんち</button>

</div>
<div id="stick" class="ui" hidden><div id="knob"></div></div>

<script>
// モジュールが読めない・落ちた時に画面に出す（実機で原因を見るため）
addEventListener('error', e => { const el = document.getElementById('err'); el.hidden = false; el.textContent += e.message + ' '; });

<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';

const VERSION = 'v147';
// 空と地面の写真素材：Poly Haven（CC0）kloofendal_38d_partly_cloudy_puresky / sparse_grass / stony_dirt_path / river_small_rocks / aerial_grass_rock
const low = /[?&]q=low/.test(location.search);
// 見え方の切り分け用（実機で比べる）：?a=ダッシュで視野を広げない ?b=地面の遠近の質感切り替えなし ?c=影なし ?d=草の層を色分け
const AB = (location.search.match(/[?&]([abcd])(?=&|$)/g) || []).map(x => x.slice(1)).join('');
const BLADES = low ? 40000 : 80000;
const PATCH = 28;              // 草を生やす範囲（犬の少し前を中心に巻き戻す）
const PATCH_AHEAD = 5.5;       // 範囲の中心を視線の先へずらす量（後ろの草は見えないので前へ回す）
// 遠景の草：まばらで幅広の葉を、手前の草が尽きるあたりから先へ広く生やす（草の切れ目を遠くの霞へ追いやる）
const FAR_BLADES = low ? 0 : 30000, FAR_PATCH = 84, FAR_AHEAD = 26;
const FOG_NEAR = 16, FOG_FAR = 150;
const FOG_COLOR = new THREE.Color(0xcdd0bc);

  // 何をするかを決める（毎フレーム）。user＝プレイヤーが動かしているか

      const k = S.frantic;
      P.neck += (0.95 - P.neck) * k; P.headPitch += (0.25 + Math.sin(t * 95) * 0.035 + Math.sin(t * 9) * 0.06) * k;
      P.headYaw += Math.sin(t * 5.3) * 0.35 * k; P.wag = Math.max(P.wag, 0.2 * k); P.wagHz = Math.max(P.wagHz, 9 * k); P.tailDown = Math.min(P.tailDown, -0.3 * k);
    }
    if (S.smell) {   // 飼い主のにおいを嗅ぐ：鼻を当てる高さまで首を伸ばし、鼻をひくつかせる
      const h = S.smell, up = Math.max(0, (h - 0.45) / 0.4);   // 0＝脚（ひざの高さ）… 1＝尻
      P.pitch += 0.28 * up; P.y += 0.05 * up; P.neck += 0.1 - 0.75 * up; P.headPitch += 0.15 - 0.6 * up + sniffTwitch(t) * 1.4;
      P.look = 0; P.headYaw = Math.sin(t * 1.7) * 0.15; P.wag = Math.max(P.wag, 0.15); P.earsBack = Math.max(P.earsBack, 0.1);

    }

      const k = S.hunch;
      P.y -= 0.05 * k; P.pitch += 0.14 * k; P.flex -= 0.3 * k; P.tailDown = Math.max(P.tailDown, 0.25 * k);
    }
    if (S.happy > 0.01) {   // 散歩で歩調が合っている：尻尾を大きく振り、口を開けて笑う
      const k = S.happy;
      P.wag = Math.max(P.wag, 0.28 * k); P.wagHz = Math.max(P.wagHz, 7.5 * k);
      P.jaw = Math.max(P.jaw, 0.28 * k); P.tongue = Math.max(P.tongue, 0.7 * k); P.earsBack = Math.max(P.earsBack, 0.2 * k);

    // カメラの方を見る

    const hy = P.headYaw + (camYawL - P.headYaw) * P.look;

    }
