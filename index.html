<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>しば草原</title>
<style>
  /* 全画面の3D。UIは画面端に浮かべる。単一ルック（夕方の草原） */
  :root {
    --ink: #fffaf0;
    --glass: rgba(30, 28, 22, 0.42);
    --glass-edge: rgba(255, 250, 240, 0.35);
    --accent: #f0b46a;
    --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #cfd6c8; color: var(--ink);
    font-family: var(--font-ui);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 2; }
  #fps {
    top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px));
    font-size: 13px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0,0,0,.5); opacity: .85;
  }
  #hint {
    top: calc(env(safe-area-inset-top, 0px) + 44px); left: 50%; transform: translateX(-50%);
    background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; white-space: nowrap; transition: opacity .8s;
    max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint.off { opacity: 0; }
  #jump {
    right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
    width: 78px; height: 78px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--glass-edge); color: var(--ink);
    font: 700 15px var(--font-ui); letter-spacing: .05em;
  }
  #jump:active { background: rgba(240,180,106,.45); }
  #jump:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  #stick { width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid var(--glass-edge); background: rgba(30,28,22,.25); pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,250,240,.75); }
  #err { left: 16px; right: 16px; bottom: 140px; font-size: 12px; color: #ffd0c0; text-shadow: 0 1px 2px #000; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>

<canvas id="c"></canvas>
<div id="fps" class="ui">v3 · -- fps</div>
<div id="hint" class="ui">画面の左側をなぞると走ります</div>
<button id="jump" class="ui" type="button">ジャンプ</button>
<div id="stick" class="ui" hidden><div id="knob"></div></div>
<div id="err" class="ui" hidden></div>

<script>
// モジュールが読めない・落ちた時に画面に出す（実機で原因を見るため）
addEventListener('error', e => { const el = document.getElementById('err'); el.hidden = false; el.textContent += e.message + ' '; });
</script>
<script type="module">
import * as THREE from 'three';

const VERSION = 'v3';
const low = /[?&]q=low/.test(location.search);
const BLADES = low ? 26000 : 52000;
const PATCH = 34;              // 草を生やす範囲（犬の周りで巻き戻す）
const FOG_NEAR = 16, FOG_FAR = 150;
const FOG_COLOR = new THREE.Color(0xcdd0bc);
const SUN_DIR = new THREE.Vector3(-0.55, 0.4, -0.72).normalize();   // 太陽の方向（低め＝影が長い）
const SHADOW_BOX = 9;

const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// 地形・小川・小道・ヒース畑（JS と GLSL で同じ式。どちらかを変えたら両方変える）
function Hb(x, z) {
  return Math.sin(x * 0.045) * 1.6 + Math.cos(z * 0.038) * 1.4
       + Math.sin((x + z) * 0.09) * 0.5 + Math.sin(x * 0.17 - z * 0.13) * 0.18;
}
const streamX = z => 32 + Math.sin(z * 0.021) * 14 + Math.sin(z * 0.057 + 1.3) * 5;
const pathX = z => Math.sin(z * 0.03) * 6 + Math.sin(z * 0.071 + 0.5) * 2.5;
function H(x, z) {   // 小川の近くは谷底の高さにならし、川筋を掘る
  const sx = streamX(z), ds = Math.abs(x - sx);
  const w = 1 - smooth(2, 5, ds);
  return Hb(x, z) * (1 - w) + Hb(sx, z) * w - 0.75 * (1 - smooth(0.9, 2.8, ds));
}
const waterY = z => Hb(streamX(z), z) - 0.37;
const FIELD_GLSL = `
float Hb(vec2 p){
  return sin(p.x*0.045)*1.6 + cos(p.y*0.038)*1.4
       + sin((p.x+p.y)*0.09)*0.5 + sin(p.x*0.17-p.y*0.13)*0.18;
}
float streamX(float z){ return 32.0 + sin(z*0.021)*14.0 + sin(z*0.057+1.3)*5.0; }
float pathX(float z){ return sin(z*0.03)*6.0 + sin(z*0.071+0.5)*2.5; }
float H(vec2 p){
  float sx = streamX(p.y); float ds = abs(p.x - sx);
  float w = 1.0 - smoothstep(2.0, 5.0, ds);
  return mix(Hb(p), Hb(vec2(sx, p.y)), w) - 0.75*(1.0 - smoothstep(0.9, 2.8, ds));
}
float heather(vec2 p){
  return smoothstep(0.25, 0.6, sin(p.x*0.071 + sin(p.y*0.05)*2.0) * cos(p.y*0.063 + sin(p.x*0.043)*1.5));
}`;

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !low, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, low ? 1 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(FOG_COLOR, FOG_NEAR, FOG_FAR);
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 700);

const hemi = new THREE.HemisphereLight(0xc9dcff, 0x6b6a3a, 1.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd29a, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(low ? 1024 : 2048, low ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_BOX, right: SHADOW_BOX, top: SHADOW_BOX, bottom: -SHADOW_BOX, near: 1, far: 70 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);

// 空（グラデーションの球、カメラに追従）
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x4f86d6) }, hor: { value: FOG_COLOR },
                sunDir: { value: SUN_DIR }, sunCol: { value: new THREE.Color(0xffc27a) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = clamp(d.y, 0.0, 1.0);
        vec3 c = mix(hor, top, pow(h, 0.5));
        float s = max(dot(d, sunDir), 0.0);
        c += sunCol * (pow(s, 10.0) * 0.45 + pow(s, 600.0) * 6.0);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  })
);
sky.renderOrder = -1;
scene.add(sky);

// 遠くの山並み：稜線を何層も重ね、遠い層ほど淡く、裾は霞に溶かす（カメラに追従）
const mountains = new THREE.Group();
[ // 半径, 稜線の色, 高さ, 位相
  [340, 0xa9b7c9, 46, 1.0],
  [270, 0x93a5b5, 32, 2.7],
  [210, 0x7d9399, 20, 4.1],
  [170, 0x6f8a78, 11, 5.9],
].forEach(([R, col, amp, seed]) => {
  const N = 180, pos = [], colr = [], idx = [];
  const top = new THREE.Color(col), foot = FOG_COLOR.clone().lerp(top, 0.25);
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const h = amp * (0.55 + 0.25 * Math.sin(a * 3 + seed) + 0.13 * Math.sin(a * 7.3 + seed * 2)
                     + 0.06 * Math.sin(a * 17.1 + seed * 3) + 0.03 * Math.sin(a * 41 + seed));
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    pos.push(x, h - 6, z, x, -30, z);
    colr.push(top.r, top.g, top.b, foot.r, foot.g, foot.b);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colr, 3));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  mountains.add(m);
});
scene.add(mountains);

// ---------- 地面（高さと塗り分けは GPU で計算。メッシュは犬に合わせて格子単位で動かすだけ） ----------
const GROUND = 300, GSEG = 300, GSNAP = 6;
const groundGeo = new THREE.PlaneGeometry(GROUND, GROUND, GSEG, GSEG);
groundGeo.rotateX(-Math.PI / 2);
const groundMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
groundMat.onBeforeCompile = sh => {
  sh.vertexShader = 'varying vec2 vGW;\n' + FIELD_GLSL + '\n' + sh.vertexShader
    .replace('#include <beginnormal_vertex>', `
      vec2 gw = (modelMatrix * vec4(position, 1.0)).xz;
      float hC = H(gw);
      const float e = 0.5;
      vec3 objectNormal = normalize(vec3(H(gw - vec2(e, 0.0)) - H(gw + vec2(e, 0.0)), 2.0*e,
                                         H(gw - vec2(0.0, e)) - H(gw + vec2(0.0, e))));`)
    .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position.x, hC - 0.02, position.z); vGW = gw;');
  sh.fragmentShader = 'varying vec2 vGW;\n' + FIELD_GLSL + `
    vec3 groundCol(vec2 p){
      float v = 0.5 + 0.5*sin(p.x*0.31 + cos(p.y*0.27)*2.0);
      vec3 g = vec3(0.33 + v*0.06, 0.44 + v*0.05, 0.15 + v*0.02);
      g = mix(g, vec3(0.44, 0.31, 0.47), heather(p) * 0.9);                  // ヒースの株元（遠目にも紫に見せる）
      float dp = abs(p.x - pathX(p.y)) + sin(p.y*1.7 + p.x)*0.07;
      g = mix(g, vec3(0.50, 0.40, 0.28), 1.0 - smoothstep(0.55, 1.05, dp)); // 土の小道
      float ds = abs(p.x - streamX(p.y));
      float pebble = 0.85 + 0.15*sin(p.x*9.0)*sin(p.y*8.0);
      g = mix(g, vec3(0.30, 0.28, 0.21) * pebble, 1.0 - smoothstep(1.4, 2.3, ds)); // 川床の濡れた砂利
      return pow(g, vec3(2.2));
    }
    ` + sh.fragmentShader
    .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb = groundCol(vGW);');
};
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
ground.frustumCulled = false;
scene.add(ground);
function updateGround(px, pz) {
  ground.position.set(Math.round(px / GSNAP) * GSNAP, 0, Math.round(pz / GSNAP) * GSNAP);
}

// ---------- 小川の水面（川筋に沿った帯。犬の前後だけ作り直す） ----------
const W_ROWS = 300, W_STEP = 0.5, W_HALF = 2.1, W_SNAP = 10;
const waterGeo = new THREE.BufferGeometry();
const wPos = new Float32Array((W_ROWS + 1) * 3 * 3);
{
  const idx = [];
  for (let r = 0; r < W_ROWS; r++) for (let c = 0; c < 2; c++) {
    const k = r * 3 + c;
    idx.push(k, k + 3, k + 1, k + 1, k + 3, k + 4);
  }
  waterGeo.setIndex(idx);
  waterGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
}
const waterU = {
  uTime: { value: 0 }, uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() }, uSkyCol: { value: new THREE.Color() },
  uFogColor: { value: FOG_COLOR }, uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR }
};
const water = new THREE.Mesh(waterGeo, new THREE.ShaderMaterial({
  uniforms: waterU, transparent: true, depthWrite: false,
  vertexShader: `
    uniform float uFogNear, uFogFar; varying vec3 vW; varying float vFog;
    void main(){ vW = position; vec4 mv = viewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv; vFog = smoothstep(uFogNear, uFogFar, -mv.z); }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uSunDir, uSunCol, uSkyCol, uFogColor;
    varying vec3 vW; varying float vFog;
    // 水底に映る光の網目（コースティクス）
    // 2組の波の打ち消し線が交わって網目になる。値は 0〜1、ほとんどの場所で 0
    float caustic(vec2 p, float t){
      vec2 q = p + vec2(sin(p.y*1.3 + t)*0.6, cos(p.x*1.1 - t*0.8)*0.6);
      float a = abs(sin(q.x*2.1 + t*0.7) + sin(q.y*2.3 - t*0.5));
      float b = abs(sin((q.x + q.y)*1.7 - t*0.6) + sin((q.x - q.y)*1.9 + t*0.4));
      return 1.0 - smoothstep(0.0, 0.14, min(a, b));
    }
    void main(){
      vec2 p = vW.xz * 2.2 + vec2(0.0, uTime * 0.6);
      vec3 V = normalize(vW - cameraPosition);
      float cs = caustic(p, uTime * 0.5) * (1.0 - smoothstep(4.0, 14.0, length(vW - cameraPosition)));
      vec3 N = normalize(vec3(sin(p.x*2.3 + uTime*1.7)*0.05 + sin(p.y*3.1 - uTime)*0.03, 1.0, cos(p.y*2.7 + uTime*1.3)*0.05));
      float fres = pow(1.0 - max(dot(-V, N), 0.0), 3.0);
      vec3 tint = pow(vec3(0.16, 0.25, 0.24), vec3(2.2)) * (uSkyCol * 0.6 + uSunCol * 0.25);
      vec3 col = tint + uSunCol * vec3(1.0, 0.9, 0.65) * cs * 0.13;
      col = mix(col, uSkyCol * 0.3, fres * 0.7);
      vec3 R = reflect(V, N);
      col += uSunCol * pow(max(dot(R, uSunDir), 0.0), 90.0) * 0.9;
      float a = mix(0.5, 0.85, fres) + cs * 0.2;
      gl_FragColor = vec4(mix(col, uFogColor, vFog), clamp(a, 0.0, 1.0));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
water.frustumCulled = false;
scene.add(water);
let wZ = NaN;
function updateWater(pz) {
  const z0 = Math.round(pz / W_SNAP) * W_SNAP - (W_ROWS * W_STEP) / 2;
  if (z0 === wZ) return;
  wZ = z0;
  for (let r = 0; r <= W_ROWS; r++) {
    const z = z0 + r * W_STEP, sx = streamX(z), y = waterY(z);
    for (let c = 0; c < 3; c++) {
      const k = (r * 3 + c) * 3;
      wPos[k] = sx + (c - 1) * W_HALF; wPos[k + 1] = y; wPos[k + 2] = z;
    }
  }
  waterGeo.attributes.position.needsUpdate = true;
}

// ---------- 草（インスタンス描画。揺れ・押しのけ・影・逆光をシェーダで） ----------
const blade = new THREE.InstancedBufferGeometry();
blade.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.5, 0, 0,  0.5, 0, 0,
  -0.42, 0.4, 0,  0.42, 0.4, 0,
  -0.28, 0.75, 0,  0.28, 0.75, 0,
  0, 1, 0
], 3));
blade.setIndex([0,1,2, 1,3,2, 2,3,4, 3,5,4, 4,5,6]);
const offs = new Float32Array(BLADES * 3);
for (let i = 0; i < BLADES; i++) {
  offs[i * 3] = Math.random() * PATCH;
  offs[i * 3 + 1] = Math.random() * PATCH;
  offs[i * 3 + 2] = Math.random();
}
blade.setAttribute('aOff', new THREE.InstancedBufferAttribute(offs, 3));
blade.instanceCount = BLADES;
const grassU = {
  uTime: { value: 0 }, uSize: { value: PATCH }, uCenter: { value: new THREE.Vector2() },
  uDog: { value: new THREE.Vector3() }, uDogR: { value: 0.5 }, uFogColor: { value: FOG_COLOR },
  uFogNear: { value: FOG_NEAR }, uFogFar: { value: FOG_FAR },
  uSunDir: { value: SUN_DIR }, uSunCol: { value: new THREE.Color() }, uSkyCol: { value: new THREE.Color() },
  uShadowMap: { value: null }, uShadowMatrix: { value: sun.shadow.matrix },
  uShadowTexel: { value: new THREE.Vector2(1 / sun.shadow.mapSize.x, 1 / sun.shadow.mapSize.y) }
};
const grass = new THREE.Mesh(blade, new THREE.ShaderMaterial({
  uniforms: grassU, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uTime, uSize, uFogNear, uFogFar, uDogR; uniform vec2 uCenter; uniform vec3 uDog;
    uniform mat4 uShadowMatrix;
    attribute vec3 aOff;
    varying float vT, vR, vFog, vWind, vHe;
    varying vec3 vWorld; varying vec4 vShadow;
    ${FIELD_GLSL}
    void main(){
      vec2 base = mod(aOff.xy - uCenter + uSize*0.5, uSize) + uCenter - uSize*0.5;
      float r = aOff.z;
      float t = position.y;
      float edge = 1.0 - smoothstep(0.6, 1.0, length(base - uCenter) / (uSize*0.5));
      float he = heather(base);
      float dp = abs(base.x - pathX(base.y)), ds = abs(base.x - streamX(base.y));
      float h = (0.13 + 0.2*fract(r*7.13)) * edge
              * smoothstep(0.45, 1.2, dp) * smoothstep(1.7, 2.5, ds)   // 小道と川には生やさない
              * (1.0 - 0.25*he);
      vHe = he;
      float w = 0.028 + 0.02*fract(r*3.71);
      float ang = r * 6.2831;
      vec2 face = vec2(cos(ang), sin(ang));
      vec2 side = vec2(-face.y, face.x);
      float wv = sin(uTime*1.6 + base.x*0.21 + base.y*0.13)*0.6 + sin(uTime*2.7 + base.x*0.53 - base.y*0.41)*0.3;
      vec2 bend = vec2(0.85, 0.45) * (wv*0.16 + 0.1) + face * (fract(r*13.1) - 0.5) * 0.35;
      vec2 dd = base - uDog.xz; float dl = length(dd);
      float push = (1.0 - smoothstep(0.16*uDogR, 1.1*uDogR, dl)) * (1.0 - smoothstep(0.1, 0.6, uDog.y - H(uDog.xz)));
      bend += (dd / max(dl, 0.001)) * push * 1.4;
      float tt = t*t;
      vec2 p = base + side * position.x * w + bend * tt * h;
      float y = H(base) + t*h*(1.0 - 0.45*min(length(bend), 1.2)*tt);
      vec4 wp = vec4(p.x, y, p.y, 1.0);
      vWorld = wp.xyz;
      vShadow = uShadowMatrix * wp;
      vec4 mv = viewMatrix * wp;
      gl_Position = projectionMatrix * mv;
      vFog = smoothstep(uFogNear, uFogFar, -mv.z);
      vT = t; vR = r; vWind = wv;
    }`,
  fragmentShader: `
    #include <packing>
    uniform vec3 uFogColor, uSunDir, uSunCol, uSkyCol;
    uniform sampler2D uShadowMap; uniform vec2 uShadowTexel;
    varying float vT, vR, vFog, vWind, vHe;
    varying vec3 vWorld; varying vec4 vShadow;
    float lit(vec4 sc){
      vec3 c = sc.xyz / sc.w;
      if (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0 || c.z > 1.0) return 1.0;
      float s = 0.0;
      s += step(c.z - 0.0015, unpackRGBAToDepth(texture2D(uShadowMap, c.xy + vec2(-0.7,-0.7)*uShadowTexel)));
      s += step(c.z - 0.0015, unpackRGBAToDepth(texture2D(uShadowMap, c.xy + vec2( 0.7,-0.7)*uShadowTexel)));
      s += step(c.z - 0.0015, unpackRGBAToDepth(texture2D(uShadowMap, c.xy + vec2(-0.7, 0.7)*uShadowTexel)));
      s += step(c.z - 0.0015, unpackRGBAToDepth(texture2D(uShadowMap, c.xy + vec2( 0.7, 0.7)*uShadowTexel)));
      return s * 0.25;
    }
    vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
    void main(){
      vec3 root = mix(vec3(0.20,0.31,0.10), vec3(0.27,0.38,0.12), fract(vR*5.3));
      vec3 tip = mix(vec3(0.50,0.58,0.25), vec3(0.64,0.62,0.32), fract(vR*9.7));
      vec3 col = mix(root, tip, smoothstep(0.0, 1.0, vT));
      float top = smoothstep(0.25, 0.9, vT);
      float hp = vHe * step(0.2, fract(vR*17.3));                          // ヒースの紫の穂
      col = mix(col, mix(vec3(0.52,0.28,0.56), vec3(0.70,0.40,0.70), fract(vR*23.1)), hp * top);
      float fl = step(fract(vR*31.7), 0.035) * (1.0 - vHe);                 // 草むらの小さな花
      col = mix(col, fract(vR*53.0) < 0.5 ? vec3(0.95,0.82,0.3) : vec3(0.95,0.93,0.86), fl * smoothstep(0.8, 0.95, vT));
      vec3 albedo = toLin(col);
      float sh = lit(vShadow);
      float wrap = 0.22 + 0.3*vT;                                   // 地面と同じくらいの日の当たり方。根元ほど陰る
      vec3 V = normalize(vWorld - cameraPosition);
      float back = pow(max(dot(V, uSunDir), 0.0), 4.0) * vT * vT;   // 逆光で葉先が透ける
      vec3 light = uSkyCol * (0.45 + 0.55*vT) + uSunCol * sh * (wrap + back * 0.7);
      vec3 c = albedo * light * (0.92 + 0.12*vWind);
      c += uSunCol * vec3(0.12, 0.1, 0.02) * back * sh;
      gl_FragColor = vec4(mix(c, uFogColor, vFog), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
grass.frustumCulled = false;
scene.add(grass);

// ---------- 木 ----------
const TREE_AREA = 150;
const trees = [];
{
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b4632, roughness: 1 });
  const leafMats = [0x3d5a2a, 0x4a6630, 0x55702f].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.95 }));
  for (let i = 0; i < 34; i++) {
    const g = new THREE.Group();
    const s = 0.8 + Math.random() * 0.9;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.18 * s, 2.4 * s, 6), trunkMat);
    trunk.position.y = 1.2 * s; g.add(trunk);
    const n = 2 + (i % 2);
    for (let k = 0; k < n; k++) {
      const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry((1.3 - k * 0.25) * s, 0), leafMats[(i + k) % 3]);
      leaf.position.set((Math.random() - 0.5) * 0.6 * s, (2.6 + k * 0.9) * s, (Math.random() - 0.5) * 0.6 * s);
      leaf.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      g.add(leaf);
    }
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.userData.bx = Math.random() * TREE_AREA; g.userData.bz = Math.random() * TREE_AREA;
    trees.push(g); scene.add(g);
  }
}
const wrap = (v, c, size) => ((((v - c + size / 2) % size) + size) % size) + c - size / 2;

// ---------- 犬の見た目（差し替え可能な部品） ----------
// 約束：{ object, radius, update(pose, dt, t) } を返す。
// object は足元が原点・+Z が正面。位置と向きはゲーム側が object に入れる。
// pose = { speed(m/s), sit(0..1), jumpY(m), vy(m/s) }。脚や尾の動きは部品の中で完結させる。
// 将来 glTF の柴に替えるときは、同じ約束の createModelDog() を作って差し替える。
function createPrimitiveDog() {
  const RED = 0xc4692e, CREAM = 0xf4e8d2, BLACK = 0x1b1410;
  const mRed = new THREE.MeshStandardMaterial({ color: RED, roughness: 0.85 });
  const mCream = new THREE.MeshStandardMaterial({ color: CREAM, roughness: 0.9 });
  const mBlack = new THREE.MeshStandardMaterial({ color: BLACK, roughness: 0.25 });
  const mEarRed = new THREE.MeshStandardMaterial({ color: RED, roughness: 0.85, flatShading: true });
  const mEarIn = new THREE.MeshStandardMaterial({ color: 0xe9c9a8, roughness: 0.9, flatShading: true });
  const SPH = new THREE.SphereGeometry(1, 18, 14);
  const blob = (mat, sx, sy, sz, x, y, z, parent) => {
    const m = new THREE.Mesh(SPH, mat);
    m.scale.set(sx, sy, sz); m.position.set(x, y, z); parent.add(m); return m;
  };
  const dog = new THREE.Group();
  const body = new THREE.Group();           // 胴（座る時に傾ける）
  body.position.y = 0.37;
  dog.add(body);
  blob(mRed, 0.15, 0.15, 0.3, 0, 0, 0, body);
  blob(mCream, 0.128, 0.11, 0.25, 0, -0.052, 0.01, body);       // 腹（裏白）
  blob(mCream, 0.112, 0.13, 0.1, 0, -0.02, 0.235, body);        // 胸
  blob(mRed, 0.1, 0.12, 0.12, 0, 0.08, 0.25, body);             // 首
  blob(mRed, 0.065, 0.09, 0.085, 0.07, -0.03, -0.19, body);     // 太もも
  blob(mRed, 0.065, 0.09, 0.085, -0.07, -0.03, -0.19, body);

  const head = new THREE.Group();
  head.position.set(0, 0.17, 0.33);
  body.add(head);
  blob(mRed, 0.13, 0.12, 0.13, 0, 0, 0, head);
  blob(mRed, 0.062, 0.05, 0.09, 0, -0.018, 0.11, head);         // 鼻すじ
  blob(mCream, 0.06, 0.042, 0.088, 0, -0.048, 0.108, head);     // 口まわり
  blob(mCream, 0.062, 0.058, 0.06, 0.062, -0.045, 0.06, head);  // 頬
  blob(mCream, 0.062, 0.058, 0.06, -0.062, -0.045, 0.06, head);
  blob(mCream, 0.085, 0.05, 0.08, 0, -0.08, 0.02, head);        // あご下
  blob(mBlack, 0.024, 0.02, 0.02, 0, -0.012, 0.197, head);      // 鼻
  blob(mBlack, 0.017, 0.019, 0.012, 0.052, 0.028, 0.111, head); // 目
  blob(mBlack, 0.017, 0.019, 0.012, -0.052, 0.028, 0.111, head);
  blob(mCream, 0.016, 0.01, 0.01, 0.042, 0.062, 0.108, head);   // 麻呂眉
  blob(mCream, 0.016, 0.01, 0.01, -0.042, 0.062, 0.108, head);
  const ears = [];
  for (const s of [1, -1]) {
    const ear = new THREE.Group();
    ear.position.set(0.062 * s, 0.085, -0.015);
    ear.rotation.set(0.12, 0, -0.28 * s);
    const outer = new THREE.Mesh(new THREE.ConeGeometry(0.048, 0.11, 4), mEarRed);
    outer.position.y = 0.05; outer.rotation.y = Math.PI / 4; outer.scale.z = 0.55;
    const inner = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.075, 4), mEarIn);
    inner.position.set(0, 0.04, 0.016); inner.rotation.y = Math.PI / 4; inner.scale.z = 0.4;
    ear.add(outer, inner); head.add(ear); ears.push(ear);
  }

  const tail = new THREE.Group();          // 付け根（振る・横に倒す）
  tail.position.set(0, 0.1, -0.25);
  body.add(tail);
  const tailCurl = new THREE.Group();
  tailCurl.position.set(0, 0.06, 0.07);
  tailCurl.rotation.y = Math.PI / 2;
  tail.add(tailCurl);
  const tailRing = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.042, 10, 26, 4.7), mRed);
  tailRing.rotation.z = -0.35;
  tailCurl.add(tailRing);
  const tailIn = new THREE.Mesh(new THREE.TorusGeometry(0.068, 0.026, 8, 22, 4.2), mCream);
  tailIn.rotation.z = -0.15; tailIn.position.z = 0.012;
  tailCurl.add(tailIn);
  blob(mRed, 0.04, 0.045, 0.04, 0, 0, 0, tail);

  // 脚（付け根を回す）
  const legGeoUp = new THREE.CylinderGeometry(0.036, 0.03, 0.2, 8); legGeoUp.translate(0, -0.1, 0);
  const legGeoLo = new THREE.CylinderGeometry(0.031, 0.029, 0.11, 8); legGeoLo.translate(0, -0.245, 0);
  const pawGeo = new THREE.SphereGeometry(0.036, 10, 8); pawGeo.scale(1, 0.6, 1.25); pawGeo.translate(0, -0.3, 0.012);
  const legs = [[0.075, 0.2], [-0.075, 0.2], [0.08, -0.19], [-0.08, -0.19]].map(([x, z]) => {
    const g = new THREE.Group();
    g.position.set(x, -0.065, z);
    g.add(new THREE.Mesh(legGeoUp, mRed), new THREE.Mesh(legGeoLo, mCream), new THREE.Mesh(pawGeo, mCream));
    body.add(g); return g;
  });
  dog.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

  const TROT = [0, Math.PI, Math.PI, 0], GALLOP = [0, 0.45, Math.PI, Math.PI + 0.45];
  let phase = 0;
  function update(pose, dt, t) {
    const { speed, sit, jumpY, vy } = pose;
    const air = smooth(0, 0.15, jumpY);
    // 脚の運び：遅いと速歩、速いと駆け足
    const run = smooth(2.5, 4.8, speed);
    phase += dt * Math.PI * 2 * (1.1 + speed * 0.36);
    const amp = Math.min(1, speed / 1.5) * (0.55 + 0.25 * run) * (1 - air);
    legs.forEach((l, i) => {
      const off = TROT[i] + (GALLOP[i] - TROT[i]) * run;
      let r = Math.sin(phase + off) * amp;
      if (i < 2) r += 0.75 * sit - 0.5 * air; else r += -0.65 * sit + 0.6 * air;
      l.rotation.x = r;
    });
    body.rotation.x = Math.sin(phase) * 0.09 * run * (1 - air) - 0.75 * sit - 0.12 * Math.sign(vy) * air;
    body.position.y = 0.37 + Math.abs(Math.sin(phase)) * 0.035 * amp - 0.1 * sit;
    body.position.z = -0.06 * sit;
    head.rotation.x = 0.62 * sit - Math.sin(phase) * 0.06 * run + 0.15 * run;
    ears.forEach(e => { e.rotation.x = 0.12 - 0.35 * run; });
    tail.rotation.z = 0.45 + Math.sin(t * (speed < 0.5 ? 9 : 5)) * (speed < 0.5 ? 0.18 : 0.06);
  }
  return { object: dog, radius: 0.5, update };
}
const dogView = createPrimitiveDog();
scene.add(dogView.object);
grassU.uDogR.value = dogView.radius;

// 足元の接地影（太陽の影とは別に、足元をうっすら暗くする）
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const contact = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: 0.45, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
contact.rotation.x = -Math.PI / 2;
scene.add(contact);

// ---------- 入力 ----------
const input = { x: 0, y: 0 };
const keys = {};
let stickId = null, stickX = 0, stickY = 0, camId = null, camLastX = 0, camDragT = -99;
const stickEl = document.getElementById('stick'), knobEl = document.getElementById('knob');
const hintEl = document.getElementById('hint');
let jumpReq = false;
const STICK_R = 50;
const clock = new THREE.Clock();

canvas.addEventListener('pointerdown', e => {
  if (e.clientX < innerWidth * 0.55 && stickId === null) {
    stickId = e.pointerId; stickX = e.clientX; stickY = e.clientY;
    stickEl.style.left = stickX + 'px'; stickEl.style.top = stickY + 'px';
    knobEl.style.transform = ''; stickEl.hidden = false;
  } else if (camId === null) {
    camId = e.pointerId; camLastX = e.clientX;
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === stickId) {
    let dx = e.clientX - stickX, dy = e.clientY - stickY;
    const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx *= STICK_R / d; dy *= STICK_R / d; }
    knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
    input.x = dx / STICK_R; input.y = -dy / STICK_R;
  } else if (e.pointerId === camId) {
    camYaw -= (e.clientX - camLastX) * 0.006; camLastX = e.clientX; camDragT = clock.elapsedTime;
  }
});
const endPointer = e => {
  if (e.pointerId === stickId) { stickId = null; input.x = input.y = 0; stickEl.hidden = true; }
  if (e.pointerId === camId) camId = null;
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
const jumpBtn = document.getElementById('jump');
jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); jumpReq = true; });
jumpBtn.addEventListener('click', e => { if (e.detail === 0) jumpReq = true; });
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { jumpReq = true; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- 状態 ----------
const st = { x: 0, z: 0, yaw: 0, speed: 0, jumpY: 0, vy: 0, idle: 0, sit: 0 };
let camYaw = 0;
const fpsEl = document.getElementById('fps');
let fpsN = 0, fpsT = 0, hinted = false;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
const camGoal = new THREE.Vector3();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.fov = w < h ? 62 : 50; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// 光の色と強さを草シェーダにも渡す（地面・犬と同じ明るさに揃える）
grassU.uSunCol.value.copy(sun.color).multiplyScalar(sun.intensity);
grassU.uSkyCol.value.copy(hemi.color).lerp(hemi.groundColor, 0.35).multiplyScalar(hemi.intensity);
waterU.uSunCol.value.copy(grassU.uSunCol.value);
waterU.uSkyCol.value.copy(hemi.color).multiplyScalar(hemi.intensity);

function step(dt, t) {
  // 入力 → 進む向き（カメラ基準）
  let ix = input.x, iy = input.y;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyW || keys.ArrowUp) iy += 1;
  if (keys.KeyS || keys.ArrowDown) iy -= 1;
  let mag = Math.min(Math.hypot(ix, iy), 1);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
  const dx = fx * iy - fz * ix, dz = fz * iy + fx * ix;
  if (mag > 0.08) {
    st.yaw += angDiff(st.yaw, Math.atan2(dx, dz)) * Math.min(1, dt * 7);
    if (!hinted) { hinted = true; setTimeout(() => hintEl.classList.add('off'), 2500); }
  } else mag = 0;
  const inWater = Math.abs(st.x - streamX(st.z)) < 1.8;
  const target = mag * (inWater ? 3.2 : 6.5);           // 川の中は水を分けて進むので遅い
  st.speed += (target - st.speed) * Math.min(1, dt * (target > st.speed ? 2.5 : 4));
  st.x += Math.sin(st.yaw) * st.speed * dt;
  st.z += Math.cos(st.yaw) * st.speed * dt;

  // ジャンプ
  if (jumpReq && st.jumpY <= 0.001) { st.vy = 3.6; st.sit = Math.min(st.sit, 0.3); st.idle = 0; }
  jumpReq = false;
  st.vy -= 12 * dt; st.jumpY = Math.max(0, st.jumpY + st.vy * dt);
  if (st.jumpY === 0) st.vy = 0;

  // 止まってしばらくすると座る
  st.idle = st.speed < 0.15 && st.jumpY === 0 ? st.idle + dt : 0;
  st.sit += ((st.idle > 2.5 ? 1 : 0) - st.sit) * Math.min(1, dt * 4);

  dogView.update(st, dt, t);
  const gy = H(st.x, st.z);
  dogView.object.position.set(st.x, gy + st.jumpY, st.z);
  dogView.object.rotation.y = st.yaw;
  contact.position.set(st.x, gy + 0.01, st.z);
  const cs = 0.7 / (1 + st.jumpY * 2);
  contact.scale.set(cs * 0.6, cs, 1);
  contact.rotation.z = st.yaw;

  // 太陽の影は犬の周りだけ描く（影の範囲を犬に追従させる）
  sun.target.position.set(st.x, gy, st.z);
  sun.position.copy(sun.target.position).addScaledVector(SUN_DIR, 35);

  // カメラ：後ろから追う（なぞって回した直後は追わない）
  const run = smooth(2.5, 4.8, st.speed);
  if (st.speed > 0.4 && t - camDragT > 1.5) camYaw += angDiff(camYaw, st.yaw) * Math.min(1, dt * 1.6);
  const dist = 2.7 + run * 0.5 - st.sit * 0.4, ch = 1.0 + run * 0.15;
  const cx = st.x - Math.sin(camYaw) * dist, cz = st.z - Math.cos(camYaw) * dist;
  const cy = Math.max(gy + ch, H(cx, cz) + 0.45);
  camera.position.lerp(camGoal.set(cx, cy, cz), Math.min(1, dt * 6));
  camera.lookAt(st.x, gy + 0.42 + st.jumpY * 0.5, st.z);

  // 周りの物を犬に合わせて巻き戻す
  grassU.uTime.value = t;
  grassU.uCenter.value.set(st.x, st.z);
  grassU.uDog.value.set(st.x, gy + st.jumpY, st.z);
  updateGround(st.x, st.z);
  updateWater(st.z);
  waterU.uTime.value = t;
  sky.position.copy(camera.position);
  mountains.position.set(camera.position.x, 0, camera.position.z);
  for (const tr of trees) {
    const x = wrap(tr.userData.bx, st.x, TREE_AREA), z = wrap(tr.userData.bz, st.z, TREE_AREA);
    tr.position.set(x, H(x, z) - 0.1, z);
    tr.visible = Math.abs(x - streamX(z)) > 4 && Math.abs(x - pathX(z)) > 2.5;   // 川と小道には木を立てない
  }
}

// 最初の一枚：小道の上、犬の斜め後ろから
st.x = pathX(0); st.yaw = 0.6; camYaw = 0.6;
step(0, 0);
camera.position.set(st.x - Math.sin(camYaw) * 2.7, H(st.x, st.z) + 1.0, st.z - Math.cos(camYaw) * 2.7);
camera.lookAt(st.x, H(st.x, st.z) + 0.42, st.z);

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  step(dt, t);
  renderer.render(scene, camera);
  if (sun.shadow.map) grassU.uShadowMap.value = sun.shadow.map.texture;
  fpsN++;
  const now = performance.now();
  if (now - fpsT >= 500) { fpsEl.textContent = VERSION + ' · ' + Math.round(fpsN * 1000 / (now - fpsT)) + ' fps'; fpsN = 0; fpsT = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__shiba = { st, input, keys, streamX, pathX, setCamYaw: v => { camYaw = v; } };
</script>
</body>
